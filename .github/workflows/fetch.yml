name: Fetch Express Pass Availability

on:
  schedule:
    # Every 30 min. A run is rate-limited to 5 req/s against the store, so a
    # cold run takes ~10 min; a warm one, which only refreshes the dates whose
    # totals moved, takes well under a minute.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# One group for both sources (USJ and Sagano), so two runs never write data/
# or push at the same time. GitHub allows one running and at most one pending
# run per group: a newer pending run replaces (cancels) an older pending one,
# and with cancel-in-progress: false a running job is never cancelled.
concurrency:
  group: fetch
  cancel-in-progress: false

# Kill switches: set repo variable USJ_FETCH_ENABLED or SAGANO_FETCH_ENABLED to
# 'false' to skip that source. Unset means enabled.
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      - name: Fetch USJ
        if: vars.USJ_FETCH_ENABLED != 'false'
        run: npm run fetch

      # Independent of USJ: runs even when the USJ step failed, and its own
      # failure (which keeps the previous days.json marked stale) must not stop
      # the USJ data from committing below. 1 req/s, <=60 requests per run.
      # 12 min covers the worst successful case (~33 requests each near the
      # 15 s request timeout) so the step is not killed before it can mark
      # stale, and still fits the 25-min job after a ~10-min cold USJ run.
      - name: Fetch Sagano
        if: ${{ !cancelled() && vars.SAGANO_FETCH_ENABLED != 'false' }}
        continue-on-error: true
        timeout-minutes: 12
        run: npm run fetch:sagano

      # Skipped when USJ is disabled, so it does not re-emit the last run's warnings.
      - name: Flag failed products
        if: always() && vars.USJ_FETCH_ENABLED != 'false'
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('data/index.json','utf8'));
            for (const p of r.products.filter(p => p.error)) {
              console.log('::warning title=' + p.code + ' fetch failed::' + p.error);
            }
            if (r.budgetExhausted) {
              console.log('::warning title=request budget::Run hit its request cap; some slot data was carried over.');
            }
          "

      # Runs even when one product failed, so the healthy products' fresh data
      # still lands in git. Only a total outage reddens the run (npm run fetch
      # exits non-zero when every product failed).
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update availability data"
          git push
