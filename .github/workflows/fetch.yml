name: Fetch Express Pass Availability

on:
  schedule:
    # Every 30 min. A run is rate-limited to 1 req/s against the store, so a
    # cold run takes ~12.5 min; a warm one, which only refreshes the dates
    # whose totals moved, takes ~5 min.
    #
    # This interval is not independent: it, `timeout-minutes` below,
    # `CONCURRENCY` in src/limiter.ts and `STALE_MS` in index.html are one
    # interlock group (AD-4), and changing any of them means recomputing all
    # four. src/limits.test.ts reads the numbers back out of these files and
    # fails CI if the set stops adding up — start there rather than trusting
    # this comment, which is the kind that has already been proven to drift.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Prevents overlapping fetch rounds (NFR5.1): if a round is still running when
# the next schedule fires, the new run queues instead of racing the store in
# parallel. cancel-in-progress must stay false -- cancelling a running round
# would kill it mid-write and violate data-integrity (NFR11).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      - name: Fetch
        id: fetch
        shell: bash
        run: npm run fetch --silent 2>&1 | tee fetch-output.log

      # Guards against src/fetcher.ts's `if (require.main === module) { main(); }`
      # gate silently evaluating to false (e.g. after a future ESM/tsx/launcher
      # change): if that gate stops firing, `main()` never runs, the process
      # exits 0, and this job would otherwise go green with no data fetched.
      # Every real path through main() logs at least one line (success summary,
      # a single product failure, a BlockedError abort, catalog failure, or an
      # empty target set), so an empty output file means the entry point never
      # executed. if: always() so aborted rounds (which still log before
      # exiting non-zero) are checked too, not just the success path.
      - name: Smoke-check fetch entry point
        if: always()
        run: |
          if [ "${{ steps.fetch.outcome }}" == "skipped" ]; then
            echo "::notice::Fetch step did not run (an earlier step failed); skipping entry-point smoke check."
          elif [ -s fetch-output.log ]; then
            echo "Smoke check passed: npm run fetch produced output."
          else
            echo "::error::npm run fetch produced no output -- the 'if (require.main === module)' gate in src/fetcher.ts may have failed to fire, meaning main() never ran (or an earlier failure inside 'npm run fetch' produced no output)."
            exit 1
          fi

      # success() only: an aborted round (BlockedError, catalog failure, or an
      # unmatched --product=) exits before index.json is rewritten, so running
      # this on failure would re-warn about the previous round's already-known
      # failures instead of this round's.
      - name: Flag failed products
        if: success()
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('data/index.json','utf8'));
            for (const p of r.products.filter(p => p.error)) {
              console.log('::warning title=' + p.code + ' fetch failed::' + p.error);
            }
            if (r.budgetExhausted) {
              console.log('::warning title=request budget::Run hit its request cap; some slot data was carried over.');
            }
          "

      # Runs even when one product failed, so the healthy products' fresh data
      # still lands in git. Only a total outage or a persistent block from the
      # store reddens the run (npm run fetch exits non-zero in either case).
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update availability data"
          git push
