<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USJ Express Pass 時段查詢</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 16px;
    }

    .source-label { font-size: 13px; font-weight: 700; color: #e6edf3; margin-bottom: 2px; }
    .product-code { font-size: 12px; color: #484f58; margin-bottom: 4px; font-family: monospace; }
    .product-name { font-size: 14px; color: #8b949e; margin-bottom: 16px; line-height: 1.4; }
    .product-name a { color: #58a6ff; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; }

    .selected-badge {
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .selected-badge .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    .selected-badge .date { font-size: 24px; font-weight: 700; color: #79c0ff; }
    .selected-badge .detail { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .latest-tag {
      font-size: 10px; color: #3fb950; border: 1px solid #3fb95055; background: #3fb9501a;
      border-radius: 4px; padding: 2px 6px; margin-left: 6px; vertical-align: middle;
    }

    .dow { display: inline-block; min-width: 20px; text-align: center; margin-left: 4px; font-size: 12px;
           background: #21262d; border-radius: 3px; padding: 1px 4px; color: #8b949e; vertical-align: middle; }
    .dow-sat { background: #1f4068; color: #79c0ff; }
    .dow-sun { background: #4d1f1f; color: #f85149; }

    .meta { font-size: 12px; color: #484f58; }

    .stale {
      display: inline-block;
      background: #f0883e22; border: 1px solid #f0883e55;
      color: #f0883e; border-radius: 6px;
      padding: 4px 10px; font-size: 11px; margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    /* Date picker — one pill per date whose slots were actually looked up. */
    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: thin;
    }
    .date-pill {
      flex: none;
      min-width: 74px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .date-pill:hover { background: #2d333b; }
    .date-pill.selected { background: #1f6feb33; border-color: #79c0ff; }
    .date-pill .d { font-size: 14px; font-weight: 600; color: #e6edf3; font-variant-numeric: tabular-nums; }
    .date-pill.selected .d { color: #79c0ff; }
    .date-pill .w { font-size: 11px; color: #8b949e; margin-top: 1px; }
    .date-pill .w.sat { color: #79c0ff; }
    .date-pill .w.sun { color: #f85149; }
    .date-pill .n { font-size: 11px; color: #484f58; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .date-pill .n.few { color: #f0883e; }
    .date-pill .n.none { color: #f85149; }

    /* Party size — a filter over the snapshot, not a new lookup. */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .people {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 3px;
    }
    .people button {
      width: 30px; height: 28px;
      background: none; border: none; color: #e6edf3;
      font-size: 16px; line-height: 1; cursor: pointer; border-radius: 6px;
    }
    .people button:hover:not(:disabled) { background: #30363d; }
    .people button:disabled { color: #484f58; cursor: default; }
    .people .count {
      min-width: 54px; text-align: center; font-size: 14px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .people-note { font-size: 11px; color: #484f58; }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .slot-chip {
      background: #1f6feb1a; border: 1px solid #1f6feb44; color: #79c0ff;
      border-radius: 8px; padding: 10px 8px; font-size: 14px; text-align: center;
      font-variant-numeric: tabular-nums; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .slot-chip .left { display: block; font-size: 11px; margin-top: 3px; color: #8b949e; }
    .slot-chip .left.few { color: #f0883e; }
    .slot-chip:hover { background: #1f6feb33; border-color: #1f6feb88; }
    .slot-chip.open { background: #1f6feb44; border-color: #79c0ff; color: #e6edf3; }

    .slot-detail {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
    }
    .slot-detail .head { color: #79c0ff; font-weight: 600; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
    .slot-detail .ev { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: #8b949e; }
    .slot-detail .ev .time { color: #e6edf3; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .slot-detail .code { font-family: monospace; font-size: 11px; color: #484f58; margin-top: 8px; }

    .slot-note { font-size: 12px; color: #8b949e; margin-top: 14px; line-height: 1.6; }
    .slot-note .k { color: #484f58; }

    .empty { color: #f85149; font-size: 14px; padding: 8px 0; }
    .unknown-slots { color: #8b949e; font-size: 13px; padding: 8px 0; }

    .loading { color: #8b949e; text-align: center; padding: 60px 0; font-size: 14px; }
    .error-box {
      background: #f8514922; border: 1px solid #f8514966;
      border-radius: 8px; padding: 14px; color: #f85149; font-size: 13px;
      word-break: break-word;
    }
    .updated { font-size: 11px; color: #484f58; margin-top: 16px; text-align: right; }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .card { padding: 18px 16px; border-radius: 10px; }
      .selected-badge .date { font-size: 22px; }
      .updated { text-align: left; }
      .slot-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
      .slot-chip { padding: 9px 6px; font-size: 13px; }
      .date-strip { gap: 6px; margin-left: -16px; margin-right: -16px; padding: 0 16px 8px; }
      .date-pill { min-width: 68px; padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"><div class="card"><div class="loading">載入中...</div></div></div>
  </div>

  <script>
    const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
    // Fetcher runs every 15 min; an hour of silence means something is wrong.
    const STALE_MS = 60 * 60 * 1000;
    const STORE_PREFIX = 'usj-selected-date:';
    const MAX_PEOPLE = 10;

    /** Per-source view state: which date, and for how many people. */
    const state = new Map();

    /**
     * A slot fits a party exactly when enough tickets are left in it — that is
     * the same rule the store applies when it hides slots from a larger party,
     * so the filter runs here instead of asking the store per party size.
     * A slot whose count could not be fetched is kept rather than hidden.
     */
    function slotsFor(day, people) {
      return (day && day.timeSlots ? day.timeSlots : [])
        .filter(s => s.availableUnits == null || s.availableUnits >= people);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    // localStorage throws in private mode / blocked-cookie setups; a lost
    // preference must never take the page down with it.
    function readPref(key) {
      try { return localStorage.getItem(STORE_PREFIX + key); } catch { return null; }
    }
    function writePref(key, value) {
      try { localStorage.setItem(STORE_PREFIX + key, value); } catch { /* ignore */ }
    }

    /**
     * ?date=YYYY-MM-DD picks the date for every source; ?<sourceId>=YYYY-MM-DD
     * overrides it for one. A shared link must win over whatever the recipient
     * picked last, so the query string outranks the stored preference.
     */
    function queryDate(sourceId) {
      const q = new URLSearchParams(location.search);
      const value = q.get(sourceId) || q.get('date');
      return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : null;
    }

    /** ?people=N, shared by every source. */
    function queryPeople() {
      const n = Number(new URLSearchParams(location.search).get('people'));
      return Number.isInteger(n) && n >= 1 && n <= MAX_PEOPLE ? n : null;
    }

    /** Keep the URL in sync so the current view is copy-pasteable. */
    function syncQuery(sourceId, date, people) {
      const q = new URLSearchParams(location.search);
      q.set(q.has(sourceId) ? sourceId : 'date', date);
      q.set('people', String(people));
      history.replaceState(null, '', `${location.pathname}?${q}${location.hash}`);
    }

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, dd] = d.split('-');
      return `${y}/${m}/${dd}`;
    }

    function fmtShort(d) {
      const [, m, dd] = d.split('-');
      return `${Number(m)}/${dd}`;
    }

    function fmtUpdated(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('zh-TW', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        }) + ' JST';
      } catch { return iso; }
    }

    function dowClass(n) {
      if (n === 6) return 'dow dow-sat';
      if (n === 0) return 'dow dow-sun';
      return 'dow';
    }

    function dowWordClass(n) {
      if (n === 6) return 'w sat';
      if (n === 0) return 'w sun';
      return 'w';
    }

    function money(amount, currency) {
      if (amount == null) return '—';
      try {
        return new Intl.NumberFormat('zh-TW', {
          style: 'currency', currency: currency || 'JPY', maximumFractionDigits: 0
        }).format(amount);
      } catch {
        return String(amount);
      }
    }

    // Prefer the platform's own price string; fall back to formatting the number.
    function priceText(slot, src) {
      if (!slot) return null;
      if (slot.formattedPrice) return slot.formattedPrice;
      return money(slot.pricePerPerson, src.currency);
    }

    /**
     * The selectable dates are exactly those the fetcher looked slots up for —
     * the month leading to the latest on-sale date. timeSlots === null means
     * the lookup never ran, so such a date has nothing to show.
     */
    function pickableDates(src) {
      return (src.dates || []).filter(d => d.timeSlots);
    }

    function badgeHtml(src, day, people) {
      const units = day.availableUnits != null ? `剩餘 ${day.availableUnits} 張 ｜ ` : '';
      const perPerson = priceText(day, src);
      const total = day.pricePerPerson != null
        ? ` ｜ ${people} 人合計 ${money(day.pricePerPerson * people, src.currency)}`
        : '';
      const isLatest = day.date === src.latestDate;

      return `
        <div class="label">${isLatest ? '最新開放日' : '已選日期'}</div>
        <div class="date">
          ${fmtDate(day.date)}
          <span class="${dowClass(day.dayOfWeek)}">${DAY_NAMES[day.dayOfWeek]}</span>
          ${isLatest ? '<span class="latest-tag">最新</span>' : ''}
        </div>
        <div class="detail">${units}${esc(perPerson)} /人${total}</div>`;
    }

    function slotsHtml(src, day, people, slots) {
      if (slots.length === 0) {
        const all = day.timeSlots ? day.timeSlots.length : 0;
        return `<div class="empty">${all > 0
          ? `此日的 ${all} 個時段都不足 ${people} 人`
          : '此日已無可選時段'}</div>`;
      }

      const names = src.attractionNames || {};
      const chips = slots.map((ts, i) => {
        const n = ts.availableUnits;
        const left = n == null ? '' : `<span class="left${n <= 5 ? ' few' : ''}">剩 ${n}</span>`;
        return `<div class="slot-chip" data-i="${i}">${esc(ts.from)}–${esc(ts.to)}${left}</div>`;
      }).join('');
      const nonTimed = (src.nonTimedAttractions || []).map(c => names[c] || c);

      return `
        <div class="section-title">可選時段 (${slots.length})</div>
        <div class="slot-grid">${chips}</div>
        <div class="slot-detail" hidden></div>
        ${nonTimed.length ? `<div class="slot-note"><span class="k">不限時段：</span>${esc(nonTimed.join('、'))}</div>` : ''}`;
    }

    /** Redraw everything that depends on the selected date or party size. */
    function paint(card, src) {
      const st = state.get(src.id);
      const day = (src.dates || []).find(d => d.date === st.date);
      if (!day) return;

      const slots = slotsFor(day, st.people);

      card.querySelectorAll('.date-pill').forEach(pill => {
        pill.classList.toggle('selected', pill.dataset.date === st.date);
        const pillDay = (src.dates || []).find(d => d.date === pill.dataset.date);
        const n = slotsFor(pillDay, st.people).length;
        const cell = pill.querySelector('.n');
        cell.textContent = `${n} 時段`;
        cell.className = n === 0 ? 'n none' : n <= 3 ? 'n few' : 'n';
      });

      card.querySelector('.people .count').textContent = `${st.people} 人`;
      card.querySelector('.people .minus').disabled = st.people <= 1;
      card.querySelector('.people .plus').disabled = st.people >= MAX_PEOPLE;
      card.querySelector('.selected-badge').innerHTML = badgeHtml(src, day, st.people);

      const body = card.querySelector('.slot-body');
      body.innerHTML = slotsHtml(src, day, st.people, slots);

      const detail = body.querySelector('.slot-detail');
      const names = src.attractionNames || {};
      body.querySelectorAll('.slot-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const wasOpen = chip.classList.contains('open');
          body.querySelectorAll('.slot-chip').forEach(c => c.classList.remove('open'));
          if (wasOpen) { detail.hidden = true; return; }

          const ts = slots[Number(chip.dataset.i)];
          chip.classList.add('open');
          detail.innerHTML = `
            <div class="head">${esc(ts.from)}–${esc(ts.to)}${ts.availableUnits != null ? ` ｜ 剩 ${ts.availableUnits} 張` : ''}</div>
            ${(ts.events || []).map(e => `
              <div class="ev">
                <span>${esc(names[e.code] || e.code)}</span>
                <span class="time">${esc(e.from)}–${esc(e.to)}</span>
              </div>`).join('')}
            <div class="code">${esc(ts.variantCode)}</div>`;
          detail.hidden = false;
        });
      });
    }

    function selectDate(card, src, date) {
      const st = state.get(src.id);
      if (st.date === date) return;
      st.date = date;
      writePref(src.id, date);
      syncQuery(src.id, date, st.people);
      paint(card, src);
    }

    function selectPeople(card, src, people) {
      const st = state.get(src.id);
      const next = Math.min(MAX_PEOPLE, Math.max(1, people));
      if (st.people === next) return;
      st.people = next;
      writePref(`${src.id}:people`, String(next));
      syncQuery(src.id, st.date, next);
      paint(card, src);
    }

    function sourceCard(src) {
      if (src.error) {
        return `
          <div class="card">
            <div class="source-label">${esc(src.label || src.id)}</div>
            <div class="error-box">⚠ 抓取失敗：${esc(src.error)}</div>
            <div class="updated">最後嘗試：${fmtUpdated(src.fetchedAt)}</div>
          </div>`;
      }

      const stale = src.fetchedAt && (Date.now() - new Date(src.fetchedAt).getTime() > STALE_MS);
      const dates = pickableDates(src);

      // Slot counts are filled in by paint(), which knows the party size.
      const pills = dates.map(d => `
          <div class="date-pill" data-date="${esc(d.date)}">
            <div class="d">${fmtShort(d.date)}</div>
            <div class="${dowWordClass(d.dayOfWeek)}">${DAY_NAMES[d.dayOfWeek]}</div>
            <div class="n"></div>
          </div>`).join('');

      const picker = dates.length
        ? `<div class="date-strip">${pills}</div>`
        : '<div class="unknown-slots">尚無已查詢時段的日期</div>';

      return `
        <div class="card" data-src="${esc(src.id)}">
          <div class="source-label">${esc(src.label || src.id)}</div>
          <div class="product-code">${esc(src.productCode)} ｜ ${esc(src.currency)}</div>
          <div class="product-name">${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.productName)} ↗</a>` : esc(src.productName)}</div>
          ${stale ? '<div class="stale">⚠ 資料可能過期</div>' : ''}
          ${picker}
          <div class="controls">
            <div class="people">
              <button class="minus" type="button" aria-label="減少人數">−</button>
              <span class="count"></span>
              <button class="plus" type="button" aria-label="增加人數">+</button>
            </div>
            <span class="people-note">只列出還剩得下這麼多人的時段</span>
          </div>
          <div class="selected-badge"></div>
          <div class="slot-body"></div>
          <div class="updated">更新：${fmtUpdated(src.fetchedAt)}</div>
        </div>`;
    }

    function render(data) {
      const root = document.getElementById('root');
      const sources = data.sources || [];

      if (sources.length === 0) {
        root.innerHTML = '<div class="card"><div class="error-box">結果檔中沒有任何來源。</div></div>';
        return;
      }

      root.innerHTML = `
        ${sources.map(sourceCard).join('')}
        <div class="updated">最後更新：${fmtUpdated(data.updatedAt)}</div>`;

      for (const src of sources) {
        if (src.error) continue;
        // Matched by property rather than a built selector — source ids come
        // from the data file and need no escaping this way.
        const card = [...root.querySelectorAll('.card')].find(c => c.dataset.src === src.id);
        const dates = pickableDates(src);
        if (!card || dates.length === 0) continue;

        card.querySelectorAll('.date-pill').forEach(pill => {
          pill.addEventListener('click', () => selectDate(card, src, pill.dataset.date));
        });
        card.querySelector('.people .minus').addEventListener('click', () => {
          selectPeople(card, src, state.get(src.id).people - 1);
        });
        card.querySelector('.people .plus').addEventListener('click', () => {
          selectPeople(card, src, state.get(src.id).people + 1);
        });

        // Query string, then last choice — each only while that date is still
        // in the fetched window, since the window slides forward daily. The
        // latest date is the fallback.
        const has = d => !!d && dates.some(x => x.date === d);
        const wanted = [queryDate(src.id), readPref(src.id)].find(has);
        const date = wanted
          || (has(src.latestDate) ? src.latestDate : dates[dates.length - 1].date);

        const savedPeople = Number(readPref(`${src.id}:people`));
        const people = queryPeople()
          || (savedPeople >= 1 && savedPeople <= MAX_PEOPLE ? savedPeople : 2);

        state.set(src.id, { date, people });
        writePref(src.id, date);
        writePref(`${src.id}:people`, String(people));
        syncQuery(src.id, date, people);

        paint(card, src);
        card.querySelector('.date-pill.selected')?.scrollIntoView({ block: 'nearest', inline: 'center' });
      }
    }

    fetch('./data/results.json?t=' + Date.now())
      .then(r => r.json())
      .then(render)
      .catch(err => {
        document.getElementById('root').innerHTML =
          `<div class="card"><div class="error-box">無法載入資料：${esc(err.message)}</div></div>`;
      });
  </script>
</body>
</html>
