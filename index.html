<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USJ Express Pass 時段查詢</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 16px;
    }

    /* Language switch — sits beside the source label, above the tabs. */
    .head-row { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; }
    .head-row .source-label { flex: 1; min-width: 0; margin-bottom: 0; }
    .langs { display: flex; flex: none; gap: 2px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 2px; }
    .langs button {
      background: none; border: none; border-radius: 6px;
      color: #8b949e; font-family: inherit; font-size: 12px; font-weight: 600;
      padding: 4px 9px; cursor: pointer; white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }
    .langs button:hover:not(.active) { background: #21262d; color: #e6edf3; }
    .langs button.active { background: #1f6feb33; color: #79c0ff; }

    .source-label { font-size: 13px; font-weight: 700; color: #e6edf3; margin-bottom: 2px; }
    .product-code { font-size: 12px; color: #484f58; margin-bottom: 4px; font-family: monospace; }
    .product-name { font-size: 14px; color: #8b949e; margin-bottom: 16px; line-height: 1.4; }
    .product-name a { color: #58a6ff; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; }

    .selected-badge {
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .selected-badge .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    .selected-badge .date { font-size: 24px; font-weight: 700; color: #79c0ff; }
    .selected-badge .detail { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .latest-tag {
      font-size: 10px; color: #3fb950; border: 1px solid #3fb95055; background: #3fb9501a;
      border-radius: 4px; padding: 2px 6px; margin-left: 6px; vertical-align: middle;
    }

    .dow { display: inline-block; min-width: 20px; text-align: center; margin-left: 4px; font-size: 12px;
           background: #21262d; border-radius: 3px; padding: 1px 4px; color: #8b949e; vertical-align: middle; }
    .dow-sat { background: #1f4068; color: #79c0ff; }
    .dow-sun { background: #4d1f1f; color: #f85149; }

    .meta { font-size: 12px; color: #484f58; }

    .stale {
      display: inline-block;
      background: #f0883e22; border: 1px solid #f0883e55;
      color: #f0883e; border-radius: 6px;
      padding: 4px 10px; font-size: 11px; margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    /* Date picker — one pill per date whose slots were actually looked up. */
    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: thin;
    }
    .date-pill {
      flex: none;
      min-width: 74px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .date-pill:hover { background: #2d333b; }
    .date-pill.selected { background: #1f6feb33; border-color: #79c0ff; }
    .date-pill .d { font-size: 14px; font-weight: 600; color: #e6edf3; font-variant-numeric: tabular-nums; }
    .date-pill.selected .d { color: #79c0ff; }
    .date-pill .w { font-size: 11px; color: #8b949e; margin-top: 1px; }
    .date-pill .w.sat { color: #79c0ff; }
    .date-pill .w.sun { color: #f85149; }
    .date-pill .n { font-size: 11px; color: #484f58; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .date-pill .n.few { color: #f0883e; }
    .date-pill .n.none { color: #f85149; }

    /* Party size — a filter over the snapshot, not a new lookup. */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .people {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 3px;
    }
    .people button {
      width: 30px; height: 28px;
      background: none; border: none; color: #e6edf3;
      font-size: 16px; line-height: 1; cursor: pointer; border-radius: 6px;
    }
    .people button:hover:not(:disabled) { background: #30363d; }
    .people button:disabled { color: #484f58; cursor: default; }
    .people .count {
      min-width: 54px; text-align: center; font-size: 14px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .people-note { font-size: 11px; color: #484f58; }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .slot-chip {
      background: #1f6feb1a; border: 1px solid #1f6feb44; color: #79c0ff;
      border-radius: 8px; padding: 10px 8px; font-size: 14px; text-align: center;
      font-variant-numeric: tabular-nums; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .slot-chip .left { display: block; font-size: 11px; margin-top: 3px; color: #8b949e; }
    .slot-chip .left.few { color: #f0883e; }
    .slot-chip:hover { background: #1f6feb33; border-color: #1f6feb88; }
    .slot-chip.open { background: #1f6feb44; border-color: #79c0ff; color: #e6edf3; }

    .slot-detail {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
    }
    .slot-detail .head { color: #79c0ff; font-weight: 600; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
    .slot-detail .ev { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: #8b949e; }
    .slot-detail .ev .time { color: #e6edf3; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .slot-detail .code { font-family: monospace; font-size: 11px; color: #484f58; margin-top: 8px; }

    .slot-note { font-size: 12px; color: #8b949e; margin-top: 14px; line-height: 1.6; }
    .slot-note .k { color: #484f58; }

    /* Product picker — one entry per pass in the catalogue. */
    .picker { width: 100%; }
    .picker select {
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      font-family: inherit;
      padding: 10px 12px;
      cursor: pointer;
      appearance: none;
    }
    .picker select:focus { outline: none; border-color: #79c0ff; }
    .picker-note { font-size: 11px; color: #484f58; margin-top: 8px; }

    /* View switch — the same data read either pass-first or day-first. */
    .tabs {
      display: flex;
      gap: 4px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 3px;
      margin: 12px 0;
    }
    .tabs button {
      flex: 1;
      background: none; border: none; border-radius: 6px;
      color: #8b949e; font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 7px 10px; cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .tabs button:hover:not(.active) { background: #21262d; color: #e6edf3; }
    .tabs button.active { background: #1f6feb33; color: #79c0ff; }

    /* Day-first list — one row per pass on sale that day. */
    .day-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .day-row:hover { background: #2d333b; border-color: #484f58; }
    .day-row .info { flex: 1; min-width: 0; }
    .day-row .eyebrow { font-size: 11px; color: #8b949e; }
    .day-row .title { font-size: 14px; color: #e6edf3; line-height: 1.4; }
    .day-row .tail { flex: none; text-align: right; }
    .day-row .price { font-size: 14px; font-weight: 600; color: #79c0ff; font-variant-numeric: tabular-nums; }
    .day-row .sub { font-size: 11px; color: #484f58; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .day-row .sub.few { color: #f0883e; }
    .day-row.tight { opacity: 0.45; }
    .day-row .slot-tag {
      font-size: 10px; color: #3fb950; border: 1px solid #3fb95055; background: #3fb9501a;
      border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle;
    }

    .empty { color: #f85149; font-size: 14px; padding: 8px 0; }
    .unknown-slots { color: #8b949e; font-size: 13px; padding: 8px 0; }
    .no-slots {
      background: #21262d; border: 1px solid #30363d; border-radius: 8px;
      padding: 12px 14px; font-size: 13px; color: #8b949e; line-height: 1.6;
    }
    .legal { font-size: 12px; color: #8b949e; margin-top: 14px; line-height: 1.7; }
    .legal ul { margin: 4px 0 0 18px; }
    .legal sup { font-size: 9px; }

    .loading { color: #8b949e; text-align: center; padding: 60px 0; font-size: 14px; }
    .error-box {
      background: #f8514922; border: 1px solid #f8514966;
      border-radius: 8px; padding: 14px; color: #f85149; font-size: 13px;
      word-break: break-word;
    }
    .updated { font-size: 11px; color: #484f58; margin-top: 16px; text-align: right; }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .card { padding: 18px 16px; border-radius: 10px; }
      .selected-badge .date { font-size: 22px; }
      .updated { text-align: left; }
      .slot-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
      .slot-chip { padding: 9px 6px; font-size: 13px; }
      .date-strip { gap: 6px; margin-left: -16px; margin-right: -16px; padding: 0 16px 8px; }
      .date-pill { min-width: 68px; padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"><div class="card"><div class="loading"></div></div></div>
  </div>

  <script>
    // Fetcher runs every 30 min; 90 minutes of silence means something is wrong.
    const STALE_MS = 90 * 60 * 1000;
    const STORE_PREFIX = 'usj:';
    const MAX_PEOPLE = 10;

    // The snapshot versions this page knows how to read, copied from
    // src/schema.ts — this file has no build step, so it cannot import them.
    // src/schema.test.ts reads these two literals back out of the HTML and
    // compares them to the registry, so the copy cannot drift unnoticed. Two
    // separate declarations on purpose: the two files version independently,
    // and neither number is derived from the other.
    const DAYS_SCHEMA_VERSION = 2;
    const INDEX_SCHEMA_VERSION = 5;

    /* ---------------------------------------------------------------------
     * Localisation.
     *
     * Two separate problems, solved separately. The page's own wording is a
     * plain string table, keyed and interpolated. The store's wording is not
     * ours to write: its API translates attraction names and nothing else, so
     * pass names, display prefixes and the covered-attractions blurb come back
     * in Japanese whatever language is asked for. Those go through the term
     * tables in i18n/, which are hand-kept and fall back to Japanese for
     * anything they do not cover — a missing translation must cost a phrase,
     * never a page.
     * ------------------------------------------------------------------- */

    const LOCALES = ['zh-TW', 'ja', 'en'];
    const LOCALE_LABELS = { 'zh-TW': '繁中', ja: '日本語', en: 'EN' };
    /** BCP 47 tags for Intl, which does not take our short keys as-is. */
    const INTL_LOCALE = { 'zh-TW': 'zh-TW', ja: 'ja-JP', en: 'en-US' };
    /** The store keeps a parallel site per language, keyed by the same code. */
    const STORE_PATH = { 'zh-TW': '/zh/tw/', ja: '/ja/jp/', en: '/en/us/' };

    const STRINGS = {
      'zh-TW': {
        title: 'USJ Express Pass 時段查詢',
        dayNames: ['日', '一', '二', '三', '四', '五', '六'],

        latestDate: '最新開放日',

        slotCount: n => `${n} 枠`,

        noneFitParty: (all, p) => `この日の ${all} 枠はいずれも ${p} 名に足りません`,

        passCount: n => `${n} 種`,

        dayUnitsUnknown: '残り枚数は非公開',

        dayNote: 'パスをタップすると、そのパスの時間帯表示に切り替わります。',

        staleWarning: '⚠ データが古い可能性があります',
        fetchError: m => `⚠ 前回の取得に失敗：${m}`,
        updated: t => `更新：${t}`,
        lastUpdated: t => `最終更新：${t}`,
      },

      en: {
        title: 'USJ Express Pass time slots',
        dayNames: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
        loading: 'Loading…',
        loadingProduct: 'Loading pass…',
        loadingCalendar: 'Loading calendar…',
        loadFailed: m => `Could not load the data: ${m}`,
        productLoadFailed: m => `Could not load this pass: ${m}`,
        emptyIndex: 'The index lists no passes.',
        emptyCalendar: 'No bookable dates right now.',

        catalogLabel: n => `USJ official ｜ Express Passes (${n})`,
        tabProduct: 'By pass',
        tabDate: 'By date',
        pickerNote: 'Only passes that require picking a time slot are listed. Each slot shows how many tickets are left, so the list can be filtered by party size. All-day passes such as Premium are not included.',
        fromPrice: p => ` from ${p}`,
        soldOut: ' ｜ sold out',
        otherGroup: 'Other',

        minus: 'Fewer guests',
        plus: 'More guests',
        people: n => (n === 1 ? '1 guest' : `${n} guests`),
        peopleNote: 'Only slots that still fit this many guests',
        peopleNoteNoSlots: 'No slot data for this date, so party size changes nothing',
        peopleNoteDay: 'Filtered by tickets left that day',
        peopleNoteDayHidden(n, p) { return `${n} more with too few tickets left for ${this.people(p)}`; },

        latestDate: 'Newest date on sale',
        selectedDate: 'Selected date',
        latestTag: 'newest',
        unitsLeft: n => `${n} left ｜ `,
        perPerson: ' per guest',
        partyTotal(p, m) { return ` ｜ ${m} for ${this.people(p)}`; },
        noPickableDates: 'This pass has no bookable dates right now',

        slotCount: n => (n === 1 ? '1 slot' : `${n} slots`),
        slotsTitle: n => `Time slots (${n})`,
        slotLeft: n => `${n} left`,
        slotLeftLong: n => ` ｜ ${n} left`,
        outOfWindow: 'Slots are not looked up for this date — only the month before the newest date on sale is fetched.',
        nonTimed: 'Any time: ',
        nonTimedJoin: ', ',
        noneFitParty(all, p) { return `None of this day's ${all} slots fit ${this.people(p)}`; },
        noSlotsLeft: 'No slots left on this date',

        passCount: n => (n === 1 ? '1 pass' : `${n} passes`),
        dayTitle: n => `Passes on sale (${n})`,
        dayDetail: n => `${n} passes on sale that day`,
        dayDetailFit(n, p) { return `, ${n} of them enough for ${this.people(p)}`; },
        dayEmpty: 'No passes on sale this day',
        dayUnits: n => `${n} left`,
        dayUnitsUnknown: 'Tickets left not published',
        dayPartyTotal(p, m) { return `${m} for ${this.people(p)}`; },
        dayNote: 'Tap any pass to jump to its time slots.',

        staleWarning: '⚠ This data may be out of date',

    };

    /**
     * The visitor's language, in order of how deliberate the signal is: the
     * link they followed, then the choice they made here before, then what
     * their browser asks for. Any Chinese lands on zh-TW, since it is the only
     * Chinese this page has.
     */
    function detectLocale() {
      const asked = new URLSearchParams(location.search).get('lang');
      if (LOCALES.includes(asked)) return asked;

      let saved = null;
      try { saved = localStorage.getItem(STORE_PREFIX + 'lang'); } catch { /* ignore */ }
      if (LOCALES.includes(saved)) return saved;

      for (const tag of navigator.languages || [navigator.language || '']) {
        const lower = String(tag).toLowerCase();
        if (lower.startsWith('zh')) return 'zh-TW';
        if (lower.startsWith('ja')) return 'ja';
        if (lower.startsWith('en')) return 'en';
      }
      return 'zh-TW';
    }

    let locale = detectLocale();
    const S = () => STRINGS[locale];

    /**
     * Look up one of the page's own strings; function entries take arguments.
     * They are called against their own table so a phrase can reuse a sibling
     * — English needs `people` inside half its sentences to get the plural
     * right, and Chinese and Japanese do not need it anywhere.
     */
    function t(key, ...args) {
      const table = S();
      const value = table[key];
      return typeof value === 'function' ? value.apply(table, args) : value;
    }

    /* --- Store wording ------------------------------------------------- */

    /** Hand-kept ja -> target, from i18n/terms.<locale>.json. */
    let staticTerms = new Map();
    /** ja -> en, harvested from the attraction names the API does translate. */
    const apiTerms = new Map();
    /** Both, longest key first — the order the substring pass depends on. */
    let termIndex = [];

    // Term keys are written without ™ so one key covers both the attraction
    // name, which carries a bare ™, and the blurb, which wraps it in <sup>.
    const stripTm = s => String(s ?? '').replace(/™/g, '');

    function rebuildTerms() {
      const merged = new Map(staticTerms);
      // The tables win over the API: they are where the store's own typos get
      // corrected, and an API name would quietly reinstate them.
      if (locale === 'en') {
        for (const [ja, en] of apiTerms) if (!merged.has(ja)) merged.set(ja, en);
      }
      termIndex = [...merged].sort((a, b) => b[0].length - a[0].length);
    }

    /** Feed a loaded product's translated attraction names into the table. */
    function harvestTerms(src) {
      let added = false;
      for (const entry of Object.values(src.attractionNames || {})) {
        if (!entry || typeof entry !== 'object' || !entry.en || !entry.ja) continue;
        const key = stripTm(entry.ja);
        if (apiTerms.get(key) === stripTm(entry.en)) continue;
        apiTerms.set(key, stripTm(entry.en));
        added = true;
      }
      if (added) rebuildTerms();
    }

    async function loadTerms() {
      staticTerms = new Map();
      if (locale !== 'ja') {
        try {
          const res = await fetch(`./i18n/terms.${locale}.json`);
          if (res.ok) staticTerms = new Map(Object.entries((await res.json()).terms || {}));
        } catch { /* an untranslated page still works */ }
      }
      rebuildTerms();
    }

    /**
     * Translate a store string by replacing every term the table knows,
     * longest first so a full attraction name is never shredded by one of the
     * short tokens inside it. Whatever is left over stays Japanese, which is
     * the honest fallback: a partly-translated blurb still reads.
     */
    function term(text) {
      // The store ships some strings decomposed — ジ as シ plus a combining
      // dakuten — which renders identically and compares unequal, so a whole
      // product's blurb would silently miss every key. The fetcher folds new
      // data to NFC; this covers whatever is already published.
      const source = String(text ?? '').normalize('NFC');
      if (locale === 'ja' || !source) return source;
      let out = source;
      for (const [ja, target] of termIndex) {
        if (out.includes(ja)) out = out.split(ja).join(target);
      }
      return out;
    }

    /** One attraction's name: from the API where it has one, else translated. */
    function attractionName(entry, code) {
      if (entry == null) return code ?? '';
      // Files written before translations landed hold a bare Japanese string.
      if (typeof entry === 'string') return term(entry);
      if (locale === 'ja') return entry.ja || code || '';
      if (locale === 'en' && entry.en) return entry.en;
      return term(entry.ja) || code || '';
    }

    /** The store sells the same pass off a per-language path. */
    function localizedStoreUrl(url) {
      return url ? url.replace(STORE_PATH.ja, STORE_PATH[locale]) : url;
    }

    function applyLocaleChrome() {
      document.documentElement.lang = locale;
      document.title = t('title');
      const loading = document.querySelector('#root .loading');
      if (loading) loading.textContent = t('loading');
    }

    /** Per-product view state: which date, and for how many people. */
    const state = new Map();
    /** Product files are pulled on demand and kept for the rest of the visit. */
    const productCache = new Map();
    let catalog = null;
    let currentCode = null;
    /** data/days.json, fetched the first time the day-first view is opened. */
    let calendar = null;
    /** 'product' — pick a pass, then a date. 'date' — pick a date, then a pass. */
    let view = 'product';
    /** Day-first view state; the party size is shared with the product view. */
    const dayState = { date: null, people: 2 };

    /**
     * A slot fits a party exactly when enough tickets are left in it — that is
     * the same rule the store applies when it hides slots from a larger party,
     * so the filter runs here instead of asking the store per party size.
     * A slot whose count could not be fetched is kept rather than hidden.
     */
    function slotsFor(day, people) {
      return (day && day.timeSlots ? day.timeSlots : [])
        .filter(s => s.availableUnits == null || s.availableUnits >= people);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    /**
     * The store ships the covered-attractions blurb as HTML, so it is the one
     * field that cannot simply be escaped. It is third-party markup on its way
     * into innerHTML: keep the handful of tags it actually uses, drop every
     * attribute, and let anything else through as nothing.
     */
    const RICH_TAGS = new Set(['ul', 'ol', 'li', 'br', 'sup', 'sub', 'b', 'strong', 'em', 'p', 'span']);
    function richText(html) {
      return String(html ?? '').replace(/<(\/?)([a-zA-Z0-9]+)[^>]*>/g, (_, slash, name) => {
        const tag = name.toLowerCase();
        return RICH_TAGS.has(tag) ? `<${slash}${tag}>` : '';
      });
    }

    // localStorage throws in private mode / blocked-cookie setups; a lost
    // preference must never take the page down with it.
    function readPref(key) {
      try { return localStorage.getItem(STORE_PREFIX + key); } catch { return null; }
    }
    function writePref(key, value) {
      try { localStorage.setItem(STORE_PREFIX + key, value); } catch { /* ignore */ }
    }

    /**
     * ?date=YYYY-MM-DD. A shared link must win over whatever the recipient
     * picked last, so the query string outranks the stored preference — but
     * only on the first paint, since it describes the link, not later clicks.
     */
    let queryConsumed = false;

    function queryDate() {
      if (queryConsumed) return null;
      const value = new URLSearchParams(location.search).get('date');
      return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : null;
    }

    /** ?product=CODE — which pass the link opens. */
    function queryProduct() {
      const value = new URLSearchParams(location.search).get('product');
      return /^[A-Z0-9_]+$/.test(value || '') ? value : null;
    }

    /** ?people=N, shared by every product. */
    function queryPeople() {
      const n = Number(new URLSearchParams(location.search).get('people'));
      return Number.isInteger(n) && n >= 1 && n <= MAX_PEOPLE ? n : null;
    }

    /** ?view=date opens the day-first list instead of a single pass. */
    function queryView() {
      const value = new URLSearchParams(location.search).get('view');
      return value === 'date' || value === 'product' ? value : null;
    }

    /** Keep the URL in sync so the current view is copy-pasteable. */
    function syncQuery(code, date, people) {
      const q = new URLSearchParams(location.search);
      if (code) q.set('product', code); else q.delete('product');
      q.set('date', date);
      q.set('people', String(people));
      q.set('view', view);
      // A shared link should open in the language it was read in.
      q.set('lang', locale);
      history.replaceState(null, '', `${location.pathname}?${q}${location.hash}`);
    }

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, dd] = d.split('-');
      return `${y}/${m}/${dd}`;
    }

    function fmtShort(d) {
      const [, m, dd] = d.split('-');
      return `${Number(m)}/${dd}`;
    }

    function fmtUpdated(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString(INTL_LOCALE[locale], {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        }) + ' JST';
      } catch { return iso; }
    }

    function dowClass(n) {
      if (n === 6) return 'dow dow-sat';
      if (n === 0) return 'dow dow-sun';
      return 'dow';
    }

    function dowWordClass(n) {
      if (n === 6) return 'w sat';
      if (n === 0) return 'w sun';
      return 'w';
    }

    function money(amount, currency) {
      if (amount == null) return '—';
      try {
        return new Intl.NumberFormat(INTL_LOCALE[locale], {
          style: 'currency', currency: currency || 'JPY', maximumFractionDigits: 0
        }).format(amount);
      } catch {
        return String(amount);
      }
    }

    // Prefer the platform's own price string; fall back to formatting the number.
    function priceText(slot, src) {
      if (!slot) return null;
      if (slot.formattedPrice) return slot.formattedPrice;
      return money(slot.pricePerPerson, src.currency);
    }

    /**
     * Every on-sale date is selectable, including the ones with no slot data.
     * Only the passes on the fetcher's watchlist get slots looked up, and even
     * for those only the month leading to the latest on-sale date — but a date
     * still carries a price and a sold-out state worth showing.
     */
    function pickableDates(src) {
      return (src.dates || []).filter(d => d.available);
    }

    function badgeHtml(src, day, people) {
      const units = day.availableUnits != null ? t('unitsLeft', day.availableUnits) : '';
      const perPerson = priceText(day, src);
      const total = day.pricePerPerson != null
        ? t('partyTotal', people, money(day.pricePerPerson * people, src.currency))
        : '';
      const isLatest = day.date === src.latestDate;

      return `
        <div class="label">${esc(isLatest ? t('latestDate') : t('selectedDate'))}</div>
        <div class="date">
          ${fmtDate(day.date)}
          <span class="${dowClass(day.dayOfWeek)}">${esc(t('dayNames')[day.dayOfWeek])}</span>
          ${isLatest ? `<span class="latest-tag">${esc(t('latestTag'))}</span>` : ''}
        </div>
        <div class="detail">${esc(units)}${esc(perPerson)}${esc(t('perPerson'))}${esc(total)}</div>`;
    }

    function slotsHtml(src, day, people, slots) {
      // No slot data at all: the date sits outside the window the fetcher looks
      // up. Every pass here has timed attractions — walk-up passes are dropped
      // by the fetcher, not hidden here.
      const names = src.attractionNames || {};
      const nonTimed = (src.nonTimedAttractions || [])
        .map(c => attractionName(names[c], c))
        .join(t('nonTimedJoin'));
      const nonTimedHtml = nonTimed
        ? `<span class="k">${esc(t('nonTimed'))}</span>${esc(nonTimed)}`
        : '';

      if (!day.timeSlots) {
        return `
          <div class="no-slots">
            ${esc(t('outOfWindow'))}
            ${nonTimedHtml ? `<br>${nonTimedHtml}` : ''}
          </div>`;
      }

      if (slots.length === 0) {
        const all = day.timeSlots ? day.timeSlots.length : 0;
        return `<div class="empty">${esc(all > 0
          ? t('noneFitParty', all, people)
          : t('noSlotsLeft'))}</div>`;
      }

      const chips = slots.map((ts, i) => {
        const n = ts.availableUnits;
        const left = n == null ? '' : `<span class="left${n <= 5 ? ' few' : ''}">${esc(t('slotLeft', n))}</span>`;
        return `<div class="slot-chip" data-i="${i}">${esc(ts.from)}–${esc(ts.to)}${left}</div>`;
      }).join('');

      return `
        <div class="section-title">${esc(t('slotsTitle', slots.length))}</div>
        <div class="slot-grid">${chips}</div>
        <div class="slot-detail" hidden></div>
        ${nonTimedHtml ? `<div class="slot-note">${nonTimedHtml}</div>` : ''}`;
    }

    /** Redraw everything that depends on the selected date or party size. */
    function paint(card, src) {
      const st = state.get(src.code);
      const day = (src.dates || []).find(d => d.date === st.date);
      if (!day) return;

      const slots = slotsFor(day, st.people);

      card.querySelectorAll('.date-pill').forEach(pill => {
        pill.classList.toggle('selected', pill.dataset.date === st.date);
        const pillDay = (src.dates || []).find(d => d.date === pill.dataset.date);
        const cell = pill.querySelector('.n');
        // A date with no slot data is not a date with no slots; say so rather
        // than showing a zero the fetcher never established.
        if (!pillDay || !pillDay.timeSlots) {
          cell.textContent = '—';
          cell.className = 'n';
          return;
        }
        const n = slotsFor(pillDay, st.people).length;
        cell.textContent = t('slotCount', n);
        cell.className = n === 0 ? 'n none' : n <= 3 ? 'n few' : 'n';
      });

      // Party size only filters slots, so it is meaningless without them.
      const hasSlots = !!day.timeSlots;
      card.querySelector('.people .count').textContent = t('people', st.people);
      card.querySelector('.people .minus').disabled = !hasSlots || st.people <= 1;
      card.querySelector('.people .plus').disabled = !hasSlots || st.people >= MAX_PEOPLE;
      card.querySelector('.people-note').textContent = hasSlots
        ? t('peopleNote')
        : t('peopleNoteNoSlots');
      card.querySelector('.selected-badge').innerHTML = badgeHtml(src, day, st.people);

      const body = card.querySelector('.slot-body');
      body.innerHTML = slotsHtml(src, day, st.people, slots);

      const detail = body.querySelector('.slot-detail');
      const names = src.attractionNames || {};
      body.querySelectorAll('.slot-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const wasOpen = chip.classList.contains('open');
          body.querySelectorAll('.slot-chip').forEach(c => c.classList.remove('open'));
          if (wasOpen) { detail.hidden = true; return; }

          const ts = slots[Number(chip.dataset.i)];
          chip.classList.add('open');
          detail.innerHTML = `
            <div class="head">${esc(ts.from)}–${esc(ts.to)}${ts.availableUnits != null ? esc(t('slotLeftLong', ts.availableUnits)) : ''}</div>
            ${(ts.events || []).map(e => `
              <div class="ev">
                <span>${esc(attractionName(names[e.code], e.code))}</span>
                <span class="time">${esc(e.from)}–${esc(e.to)}</span>
              </div>`).join('')}
            <div class="code">${esc(ts.variantCode)}</div>`;
          detail.hidden = false;
        });
      });
    }

    function selectDate(card, src, date) {
      const st = state.get(src.code);
      if (st.date === date) return;
      st.date = date;
      queryConsumed = true;
      writePref(`date:${src.code}`, date);
      syncQuery(src.code, date, st.people);
      paint(card, src);
    }

    function selectPeople(card, src, people) {
      const st = state.get(src.code);
      const next = Math.min(MAX_PEOPLE, Math.max(1, people));
      if (st.people === next) return;
      st.people = next;
      writePref('people', String(next));
      syncQuery(src.code, st.date, next);
      paint(card, src);
    }

    function productCard(src, summary) {
      const stale = src.fetchedAt && (Date.now() - new Date(src.fetchedAt).getTime() > STALE_MS);
      const dates = pickableDates(src);

      // Slot counts are filled in by paint(), which knows the party size.
      const pills = dates.map(d => `
          <div class="date-pill" data-date="${esc(d.date)}">
            <div class="d">${fmtShort(d.date)}</div>
            <div class="${dowWordClass(d.dayOfWeek)}">${esc(t('dayNames')[d.dayOfWeek])}</div>
            <div class="n"></div>
          </div>`).join('');

      const datePicker = dates.length
        ? `<div class="date-strip">${pills}</div>`
        : `<div class="unknown-slots">${esc(t('noPickableDates'))}</div>`;

      const title = [term(src.eyebrow), term(src.name)].filter(Boolean).join(' ');
      const url = localizedStoreUrl(src.url);

      return `
        <div class="card" data-code="${esc(src.code)}">
          <div class="product-code">${esc(src.code)} ｜ ${esc(src.currency)}</div>
          <div class="product-name">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)} ↗</a>` : esc(title)}</div>
          ${stale || summary?.stale ? `<div class="stale">${esc(t('staleWarning'))}</div>` : ''}
          ${summary?.error ? `<div class="error-box">${esc(t('fetchError', summary.error))}</div>` : ''}
          ${datePicker}
          <div class="controls">
            <div class="people">
              <button class="minus" type="button" aria-label="${esc(t('minus'))}">−</button>
              <span class="count"></span>
              <button class="plus" type="button" aria-label="${esc(t('plus'))}">+</button>
            </div>
            <span class="people-note"></span>
          </div>
          <div class="selected-badge"></div>
          <div class="slot-body"></div>
          ${src.legalDesc ? `<div class="legal">${richText(term(src.legalDesc))}</div>` : ''}
          <div class="updated">${esc(t('updated', fmtUpdated(src.fetchedAt)))}</div>
        </div>`;
    }

    /**
     * Passes are grouped by the store's own display prefix ("…パス 4"), biggest
     * pass first, so the list reads the way the store presents it rather than
     * by product code.
     */
    function groupRank(eyebrow) {
      const n = /(\d+)(\s*\+\s*\d+)?\s*$/.exec(eyebrow || '');
      return n ? Number(n[1]) : 99;   // プレミアム and friends carry no number
    }

    function pickerHtml(products) {
      const groups = new Map();
      for (const p of products) {
        // Grouped by the Japanese prefix so the ranking below stays stable, and
        // translated only on the way into the label.
        const key = p.eyebrow || '';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      }

      const ordered = [...groups.entries()].sort(
        (a, b) => groupRank(b[0]) - groupRank(a[0]) || a[0].localeCompare(b[0]),
      );

      const options = ordered.map(([key, items]) => {
        const label = key ? term(key) : t('otherGroup');
        const sorted = items.slice().sort((a, b) => (a.fromPrice ?? Infinity) - (b.fromPrice ?? Infinity));
        const opts = sorted.map(p => {
          const price = p.fromPrice != null ? t('fromPrice', money(p.fromPrice, p.currency || 'JPY')) : '';
          const sold = p.availableDateCount === 0 ? t('soldOut') : '';
          return `<option value="${esc(p.code)}">${esc(term(p.name) || p.code)}${esc(price)}${esc(sold)}</option>`;
        }).join('');
        return `<optgroup label="${esc(label)}">${opts}</optgroup>`;
      }).join('');

      const langs = LOCALES.map(code => `
            <button type="button" data-lang="${esc(code)}" lang="${esc(code)}"
              class="${code === locale ? 'active' : ''}">${esc(LOCALE_LABELS[code])}</button>`).join('');

      return `
        <div class="card">
          <div class="head-row">
            <div class="source-label">${esc(t('catalogLabel', products.length))}</div>
            <div class="langs">${langs}</div>
          </div>
          <div class="tabs">
            <button type="button" data-view="product">${esc(t('tabProduct'))}</button>
            <button type="button" data-view="date">${esc(t('tabDate'))}</button>
          </div>
          <div id="picker-host">
            <div class="picker"><select id="product-select">${options}</select></div>
            <div class="picker-note">${esc(t('pickerNote'))}</div>
          </div>
        </div>`;
    }

    /**
     * The day-first view. USJ sells a different line-up almost every day, so
     * "what can I buy on the 20th" is a question the pass-first view cannot
     * answer without opening all 28 files — data/days.json is that same data
     * transposed, and one download covers the whole calendar.
     */
    /**
     * Stop before rendering a snapshot this page does not understand (AD-14).
     *
     * The grid's shape changed in Story 1.5 without the number moving, which is
     * the shape of the accident worth guarding: a v1 file has no `status` on
     * any cell, so `onSale()` returns nothing and every day renders as sold
     * out — a plausible-looking page that is simply wrong. Comparison is
     * `!==`, not "at least": a fetcher rolled *back* a version is the case that
     * renders wrongly, and a "newer is fine" test is exactly what lets it
     * through. Throwing here lands in the caller's existing catch, which shows
     * the error box and draws no cells at all.
     */
    function assertCalendarSchema(doc) {
      const got = doc && doc.schemaVersion;
      if (got !== DAYS_SCHEMA_VERSION) {
        throw new Error('days.json schemaVersion is ' + JSON.stringify(got) + ', expected ' + DAYS_SCHEMA_VERSION);
      }
      return doc;
    }

    /** The same check for index.json, deliberately its own number and its own test. */
    function assertIndexSchema(doc) {
      const got = doc && doc.schemaVersion;
      if (got !== INDEX_SCHEMA_VERSION) {
        throw new Error('index.json schemaVersion is ' + JSON.stringify(got) + ', expected ' + INDEX_SCHEMA_VERSION);
      }
      return doc;
    }

    async function loadCalendar() {
      if (calendar) return calendar;
      const res = await fetch(`./data/days.json?t=${catalog.updatedAt}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const doc = await res.json();
      // Before the assignment, so a rejected snapshot is never cached as the
      // calendar and never reaches a renderer.
      assertCalendarSchema(doc);
      calendar = doc;
      return calendar;
    }

    /**
     * The cells of that day's grid the fetcher marked buyable.
     *
     * days.json carries every pass for every date now, each with an explicit
     * status, so `products` is no longer "what is on sale" — it is the whole
     * row. The status is read, never re-derived: a cell with no price is not
     * the same fact as a cell that is sold out.
     */
    function onSale(entry) {
      return ((entry && entry.products) || []).filter(p => p.status === 'available');
    }

    /** Passes that still have room for the party, given the day-level count. */
    function fitsParty(entry, people) {
      return onSale(entry).filter(p => p.units == null || p.units >= people);
    }

    function dayRowHtml(item) {
      const summary = catalog.products.find(p => p.code === item.code);
      const eyebrow = term(summary?.eyebrow || '');
      const name = term(summary?.name || '') || item.code;
      const tight = item.units != null && item.units < dayState.people;

      const units = item.units != null
        ? t('dayUnits', item.units)
        : t('dayUnitsUnknown');
      const slots = item.slots != null ? `<span class="slot-tag">${esc(t('slotCount', item.slots))}</span>` : '';
      const total = item.price != null
        ? `<div class="sub">${esc(t('dayPartyTotal', dayState.people, money(item.price * dayState.people, summary?.currency || 'JPY')))}</div>`
        : '';

      return `
        <button class="day-row${tight ? ' tight' : ''}" type="button" data-code="${esc(item.code)}">
          <div class="info">
            <div class="eyebrow">${esc(eyebrow)}</div>
            <div class="title">${esc(name)}${slots}</div>
            <div class="sub${item.units != null && item.units <= 5 ? ' few' : ''}">${esc(units)}</div>
          </div>
          <div class="tail">
            <div class="price">${esc(money(item.price, summary?.currency || 'JPY'))}</div>
            ${total}
          </div>
        </button>`;
    }

    /** Redraw the pass list and the strip counts for the chosen day. */
    function paintDay(card) {
      const entry = calendar.days[dayState.date];
      if (!entry) return;

      card.querySelectorAll('.date-pill').forEach(pill => {
        pill.classList.toggle('selected', pill.dataset.date === dayState.date);
        const day = calendar.days[pill.dataset.date];
        const n = day ? fitsParty(day, dayState.people).length : 0;
        const cell = pill.querySelector('.n');
        cell.textContent = t('passCount', n);
        cell.className = n === 0 ? 'n none' : n <= 2 ? 'n few' : 'n';
      });

      card.querySelector('.people .count').textContent = t('people', dayState.people);
      card.querySelector('.people .minus').disabled = dayState.people <= 1;
      card.querySelector('.people .plus').disabled = dayState.people >= MAX_PEOPLE;

      const selling = onSale(entry);
      const fitting = fitsParty(entry, dayState.people);
      const hidden = selling.length - fitting.length;
      card.querySelector('.people-note').textContent = hidden > 0
        ? t('peopleNoteDayHidden', hidden, dayState.people)
        : t('peopleNoteDay');

      card.querySelector('.selected-badge').innerHTML = `
        <div class="label">${esc(t('selectedDate'))}</div>
        <div class="date">
          ${fmtDate(dayState.date)}
          <span class="${dowClass(entry.dayOfWeek)}">${esc(t('dayNames')[entry.dayOfWeek])}</span>
        </div>
        <div class="detail">${esc(t('dayDetail', selling.length))}${
          hidden > 0 ? esc(t('dayDetailFit', fitting.length, dayState.people)) : ''}</div>`;

      const body = card.querySelector('.slot-body');
      // Rows that do not fit stay visible but dimmed — a sold-down pass is
      // still an answer to "what is on sale that day".
      body.innerHTML = selling.length
        ? `<div class="section-title">${esc(t('dayTitle', selling.length))}</div>` +
          selling.map(dayRowHtml).join('')
        : `<div class="empty">${esc(t('dayEmpty'))}</div>`;

      body.querySelectorAll('.day-row').forEach(row => {
        row.addEventListener('click', () => {
          // Hand the date over to the pass-first view so the click lands on
          // the day the user was looking at, not on that pass's own default.
          writePref(`date:${row.dataset.code}`, dayState.date);
          setView('product', row.dataset.code);
        });
      });
    }

    function selectDay(card, date) {
      if (dayState.date === date) return;
      dayState.date = date;
      queryConsumed = true;
      writePref('day', date);
      syncQuery(null, date, dayState.people);
      paintDay(card);
    }

    function selectDayPeople(card, people) {
      const next = Math.min(MAX_PEOPLE, Math.max(1, people));
      if (dayState.people === next) return;
      dayState.people = next;
      writePref('people', String(next));
      syncQuery(null, dayState.date, next);
      paintDay(card);
    }

    function renderDay() {
      const host = document.getElementById('product-root');
      // The snapshot is a full grid: every date in the fetched range has a row
      // whether or not anything is buyable on it. The strip stays what it was —
      // the days there is something to buy — rather than growing the full six
      // months of the fetch range into empty pills. Showing the rest is the
      // matrix view's job, not this one's.
      const dates = Object.keys(calendar.days).filter(date => onSale(calendar.days[date]).length > 0);

      if (dates.length === 0) {
        host.innerHTML = `<div class="card"><div class="error-box">${esc(t('emptyCalendar'))}</div></div>`;
        return;
      }

      const pills = dates.map(date => {
        const entry = calendar.days[date];
        return `
          <div class="date-pill" data-date="${esc(date)}">
            <div class="d">${fmtShort(date)}</div>
            <div class="${dowWordClass(entry.dayOfWeek)}">${esc(t('dayNames')[entry.dayOfWeek])}</div>
            <div class="n"></div>
          </div>`;
      }).join('');

      host.innerHTML = `
        <div class="card">
          <div class="date-strip">${pills}</div>
          <div class="controls">
            <div class="people">
              <button class="minus" type="button" aria-label="${esc(t('minus'))}">−</button>
              <span class="count"></span>
              <button class="plus" type="button" aria-label="${esc(t('plus'))}">+</button>
            </div>
            <span class="people-note"></span>
          </div>
          <div class="selected-badge"></div>
          <div class="slot-body"></div>
          <div class="picker-note">${esc(t('dayNote'))}</div>
        </div>`;

      const card = host.querySelector('.card');
      card.querySelectorAll('.date-pill').forEach(pill => {
        pill.addEventListener('click', () => selectDay(card, pill.dataset.date));
      });
      card.querySelector('.people .minus').addEventListener('click', () => {
        selectDayPeople(card, dayState.people - 1);
      });
      card.querySelector('.people .plus').addEventListener('click', () => {
        selectDayPeople(card, dayState.people + 1);
      });

      const has = d => !!d && dates.includes(d);
      dayState.date = [queryDate(), readPref('day')].find(has) || dates[0];

      const savedPeople = Number(readPref('people'));
      dayState.people = queryPeople()
        || (savedPeople >= 1 && savedPeople <= MAX_PEOPLE ? savedPeople : dayState.people);

      writePref('day', dayState.date);
      writePref('people', String(dayState.people));
      syncQuery(null, dayState.date, dayState.people);
      queryConsumed = true;

      paintDay(card);
      card.querySelector('.date-pill.selected')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    /** Switch between the pass-first and day-first views. */
    async function setView(next, code) {
      view = next;
      writePref('view', next);

      document.querySelectorAll('.tabs button').forEach(b => {
        b.classList.toggle('active', b.dataset.view === next);
      });
      document.getElementById('picker-host').hidden = next !== 'product';

      if (next === 'product') {
        const select = document.getElementById('product-select');
        if (code) select.value = code;
        // selectProduct short-circuits on the current code, so a return trip to
        // an already-loaded pass would leave the day card on screen.
        currentCode = null;
        await selectProduct(select.value);
        return;
      }

      document.getElementById('product-root').innerHTML =
        `<div class="card"><div class="loading">${esc(t('loadingCalendar'))}</div></div>`;
      try {
        await loadCalendar();
      } catch (err) {
        showProductError(err.message);
        return;
      }
      if (view === 'date') renderDay();
    }

    function showProductError(message) {
      document.getElementById('product-root').innerHTML =
        `<div class="card"><div class="error-box">${esc(t('productLoadFailed', message))}</div></div>`;
    }

    function renderProduct(src, summary) {
      const host = document.getElementById('product-root');
      host.innerHTML = productCard(src, summary);

      const card = host.querySelector('.card');
      const dates = pickableDates(src);
      if (dates.length === 0) return;

      card.querySelectorAll('.date-pill').forEach(pill => {
        pill.addEventListener('click', () => selectDate(card, src, pill.dataset.date));
      });
      card.querySelector('.people .minus').addEventListener('click', () => {
        selectPeople(card, src, state.get(src.code).people - 1);
      });
      card.querySelector('.people .plus').addEventListener('click', () => {
        selectPeople(card, src, state.get(src.code).people + 1);
      });

      // Query string, then last choice — each only while that date is still on
      // sale, since the calendar slides forward daily. The latest date is the
      // fallback, being the one that just opened and sells out first.
      const has = d => !!d && dates.some(x => x.date === d);
      const wanted = [queryDate(), readPref(`date:${src.code}`)].find(has);
      const date = wanted
        || (has(src.latestDate) ? src.latestDate : dates[dates.length - 1].date);

      const savedPeople = Number(readPref('people'));
      const people = queryPeople()
        || (savedPeople >= 1 && savedPeople <= MAX_PEOPLE ? savedPeople : 2);

      state.set(src.code, { date, people });
      writePref(`date:${src.code}`, date);
      writePref('people', String(people));
      syncQuery(src.code, date, people);

      paint(card, src);
      card.querySelector('.date-pill.selected')?.scrollIntoView({ block: 'nearest', inline: 'center' });

      // ?date= describes the pass the link opened, and syncQuery has just
      // rewritten it anyway — every later pass falls back to its own memory.
      queryConsumed = true;
    }

    async function selectProduct(code) {
      if (currentCode === code) return;
      currentCode = code;
      writePref('product', code);

      const summary = catalog.products.find(p => p.code === code);

      if (!productCache.has(code)) {
        document.getElementById('product-root').innerHTML =
          `<div class="card"><div class="loading">${esc(t('loadingProduct'))}</div></div>`;
        try {
          const res = await fetch(`./data/products/${encodeURIComponent(code)}.json?t=${catalog.updatedAt}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          productCache.set(code, await res.json());
        } catch (err) {
          showProductError(err.message);
          return;
        }
      }

      // A slower earlier load must not paint over a later pick.
      if (currentCode !== code) return;
      // The store's own English attraction names ride in with the product file,
      // so this is where they join the term table the blurb is translated from.
      harvestTerms(productCache.get(code));
      renderProduct(productCache.get(code), summary);
    }

    function render(index) {
      catalog = index;
      const root = document.getElementById('root');
      const products = index.products || [];

      if (products.length === 0) {
        root.innerHTML = `<div class="card"><div class="error-box">${esc(t('emptyIndex'))}</div></div>`;
        return;
      }

      root.innerHTML = `
        ${pickerHtml(products)}
        <div id="product-root"></div>
        <div class="updated">${esc(t('lastUpdated', fmtUpdated(index.updatedAt)))}</div>`;

      const select = document.getElementById('product-select');
      select.addEventListener('change', () => selectProduct(select.value));

      document.querySelectorAll('.tabs button').forEach(b => {
        b.addEventListener('click', () => setView(b.dataset.view));
      });
      document.querySelectorAll('.langs button').forEach(b => {
        b.addEventListener('click', () => setLocale(b.dataset.lang));
      });

      const has = c => !!c && products.some(p => p.code === c);
      const code = [queryProduct(), readPref('product')].find(has)
        || products.find(p => p.availableDateCount > 0)?.code
        || products[0].code;

      select.value = code;
      setView(queryView() || readPref('view') || 'product');
    }

    /**
     * Switch language and redraw from the top.
     *
     * Nothing fetched so far is language-specific — the product files carry
     * every language they have, and the calendar carries none — so the caches
     * survive and only the term table and the wording are rebuilt. The redraw
     * goes through render(), which restores the pass, date and party size from
     * the same preferences the last click wrote.
     */
    async function setLocale(next) {
      if (next === locale || !LOCALES.includes(next)) return;
      locale = next;
      writePref('lang', next);
      applyLocaleChrome();
      await loadTerms();
      // Every product file already loaded may carry names this language wants.
      for (const src of productCache.values()) harvestTerms(src);

      // render() paints the picker card only; the pass card below it is drawn
      // by selectProduct, which short-circuits on the code it is already on.
      currentCode = null;
      render(catalog);
    }

    async function boot() {
      applyLocaleChrome();
      await loadTerms();
      try {
        const res = await fetch('./data/index.json?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const doc = await res.json();
        assertIndexSchema(doc);
        render(doc);
      } catch (err) {
        document.getElementById('root').innerHTML =
          `<div class="card"><div class="error-box">${esc(t('loadFailed', err.message))}</div></div>`;
      }
    }

    boot();
  </script>
</body>
</html>
