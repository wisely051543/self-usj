<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USJ Express Pass 可用性比較</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 16px;
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .sources .card { margin-bottom: 0; }

    .source-label { font-size: 13px; font-weight: 700; color: #e6edf3; margin-bottom: 2px; }
    .product-code { font-size: 12px; color: #484f58; margin-bottom: 4px; font-family: monospace; }
    .product-name { font-size: 14px; color: #8b949e; margin-bottom: 12px; line-height: 1.4; }
    .product-name a { color: #58a6ff; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; }

    .latest-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 12px;
    }
    .latest-badge .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    .latest-badge .date { font-size: 20px; font-weight: 700; color: #79c0ff; }
    .latest-badge .detail { font-size: 12px; color: #8b949e; }

    .meta { font-size: 12px; color: #484f58; }

    .stale {
      display: inline-block;
      background: #f0883e22; border: 1px solid #f0883e55;
      color: #f0883e; border-radius: 6px;
      padding: 4px 10px; font-size: 11px; margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 720px;
    }

    thead th {
      text-align: left;
      padding: 6px 10px;
      color: #8b949e;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #30363d;
      white-space: nowrap;
    }
    thead th.group-start { border-left: 1px solid #30363d; }
    thead tr.groups th { text-align: center; color: #e6edf3; font-size: 11px; padding-bottom: 2px; }

    tbody tr { border-bottom: 1px solid #21262d; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.latest { background: #1f6feb0a; }

    td { padding: 9px 10px; white-space: nowrap; }
    td.group-start { border-left: 1px solid #21262d; }

    .date-col { font-variant-numeric: tabular-nums; font-weight: 600; }
    .dow { display: inline-block; width: 20px; text-align: center; margin-left: 4px; font-size: 11px;
           background: #21262d; border-radius: 3px; padding: 1px 2px; color: #8b949e; }
    .dow-sat { background: #1f4068; color: #79c0ff; }
    .dow-sun { background: #4d1f1f; color: #f85149; }
    .latest-marker { font-size: 10px; color: #3fb950; margin-left: 4px; }

    .avail-col { font-variant-numeric: tabular-nums; }
    .avail-low { color: #f0883e; }
    .avail-ok  { color: #8b949e; }
    .unknown   { color: #8b949e; cursor: help; }

    .price-col { font-variant-numeric: tabular-nums; color: #e6edf3; }
    .cheaper { color: #3fb950; font-weight: 600; }

    .status-available { color: #3fb950; }
    .status-soldout   { color: #f85149; }
    .missing { color: #30363d; }

    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .dot-avail  { background: #3fb950; }
    .dot-sold   { background: #f85149; }

    .legend { font-size: 11px; color: #484f58; margin-top: 12px; line-height: 1.7; }

    .loading { color: #8b949e; text-align: center; padding: 60px 0; font-size: 14px; }
    .error-box {
      background: #f8514922; border: 1px solid #f8514966;
      border-radius: 8px; padding: 14px; color: #f85149; font-size: 13px;
      word-break: break-word;
    }
    .updated { font-size: 11px; color: #484f58; margin-top: 16px; text-align: right; }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"><div class="card"><div class="loading">載入中...</div></div></div>
  </div>

  <script>
    const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
    const STALE_MS = 2 * 60 * 60 * 1000;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, dd] = d.split('-');
      return `${y}/${m}/${dd}`;
    }

    function fmtUpdated(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('zh-TW', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        }) + ' JST';
      } catch { return iso; }
    }

    function dowClass(n) {
      if (n === 6) return 'dow dow-sat';
      if (n === 0) return 'dow dow-sun';
      return 'dow';
    }

    function money(amount, currency) {
      if (amount == null) return '—';
      try {
        return new Intl.NumberFormat('zh-TW', {
          style: 'currency', currency: currency || 'JPY', maximumFractionDigits: 0
        }).format(amount);
      } catch {
        return String(amount);
      }
    }

    // Prefer the platform's own price string; fall back to formatting the number.
    function priceText(slot, src) {
      if (!slot) return null;
      if (slot.formattedPrice) return slot.formattedPrice;
      return money(slot.pricePerPerson, src.currency);
    }

    function sourceCard(src) {
      if (src.error) {
        return `
          <div class="card">
            <div class="source-label">${esc(src.label || src.id)}</div>
            <div class="error-box">⚠ 抓取失敗：${esc(src.error)}</div>
            <div class="updated">最後嘗試：${fmtUpdated(src.fetchedAt)}</div>
          </div>`;
      }

      const latest = (src.dates || []).find(d => d.date === src.latestDate);
      const stale = src.fetchedAt && (Date.now() - new Date(src.fetchedAt).getTime() > STALE_MS);
      const units = latest && latest.availableUnits != null ? `剩餘 ${latest.availableUnits} 張 ｜ ` : '';
      const perPerson = latest ? priceText(latest, src) : '';
      const total = latest && latest.pricePerPerson != null
        ? ` ｜ ${src.people} 人合計 ${money(latest.pricePerPerson * src.people, src.currency)}`
        : '';

      const latestHtml = latest ? `
        <div class="latest-badge">
          <div>
            <div class="label">最新開放日</div>
            <div class="date">${fmtDate(src.latestDate)} <span class="${dowClass(latest.dayOfWeek)}">${DAY_NAMES[latest.dayOfWeek]}</span></div>
            <div class="detail">${units}${esc(perPerson)} /人${total}</div>
          </div>
        </div>` : '<div class="meta">無可售日期</div>';

      const available = (src.dates || []).filter(d => d.available).length;

      return `
        <div class="card">
          <div class="source-label">${esc(src.label || src.id)}</div>
          <div class="product-code">${esc(src.productCode)} ｜ ${esc(src.currency)}</div>
          <div class="product-name">${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.productName)} ↗</a>` : esc(src.productName)}</div>
          ${stale ? '<div class="stale">⚠ 資料可能過期</div>' : ''}
          ${latestHtml}
          <div class="meta">可售 ${available} / ${(src.dates || []).length} 天 ｜ 查詢 ${src.people} 人</div>
          <div class="updated">更新：${fmtUpdated(src.fetchedAt)}</div>
        </div>`;
    }

    // Three distinct "no number" states: date missing on this platform,
    // sold out, or the platform simply never publishes a count.
    function cells(slot, src, isGroupStart) {
      const gs = isGroupStart ? ' group-start' : '';
      if (!slot) {
        return `
          <td class="missing${gs}">—</td>
          <td class="missing">—</td>
          <td class="missing">—</td>`;
      }

      const statusClass = slot.available ? 'status-available' : 'status-soldout';
      const dot = slot.available ? 'dot-avail' : 'dot-sold';
      const statusText = slot.available ? '販售中' : '售完';

      let availCell;
      if (!slot.available) {
        availCell = '<td class="avail-col missing">—</td>';
      } else if (slot.availableUnits == null) {
        availCell = '<td class="avail-col unknown" title="此平台未公開剩餘張數">?</td>';
      } else {
        const cls = slot.availableUnits <= 10 ? 'avail-low' : 'avail-ok';
        availCell = `<td class="avail-col ${cls}">${slot.availableUnits}</td>`;
      }

      return `
        <td class="${statusClass}${gs}"><span class="dot ${dot}"></span>${statusText}</td>
        ${availCell}
        <td class="price-col">${esc(priceText(slot, src) ?? '—')}</td>`;
    }

    function render(data) {
      const root = document.getElementById('root');
      const sources = data.sources || [];

      if (sources.length === 0) {
        root.innerHTML = '<div class="card"><div class="error-box">結果檔中沒有任何來源。</div></div>';
        return;
      }

      // Union of every date any source knows about.
      const byDate = new Map();
      for (const src of sources) {
        for (const slot of (src.dates || [])) {
          if (!byDate.has(slot.date)) byDate.set(slot.date, {});
          byDate.get(slot.date)[src.id] = slot;
        }
      }
      const allDates = [...byDate.keys()].sort();

      let rows = '';
      for (const date of allDates) {
        const perSource = byDate.get(date);
        const anySlot = sources.map(s => perSource[s.id]).find(Boolean);
        const isLatest = sources.some(s => s.latestDate === date);

        rows += `
          <tr class="${isLatest ? 'latest' : ''}">
            <td class="date-col">
              ${fmtDate(date)}<span class="${dowClass(anySlot.dayOfWeek)}">${DAY_NAMES[anySlot.dayOfWeek]}</span>${isLatest ? '<span class="latest-marker">★</span>' : ''}
            </td>
            ${sources.map((s, i) => cells(perSource[s.id], s, i > 0)).join('')}
          </tr>`;
      }

      const groupHeader = sources
        .map((s, i) => `<th colspan="3" class="${i > 0 ? 'group-start' : ''}">${esc(s.label || s.id)}</th>`)
        .join('');
      const colHeader = sources
        .map((s, i) => `<th class="${i > 0 ? 'group-start' : ''}">狀態</th><th>剩餘</th><th>票價/人</th>`)
        .join('');

      root.innerHTML = `
        <div class="sources">${sources.map(sourceCard).join('')}</div>
        <div class="card">
          <div class="section-title">每日狀況 (${allDates.length} 天)</div>
          <div class="table-wrap">
            <table>
              <thead>
                ${sources.length > 1 ? `<tr class="groups"><th></th>${groupHeader}</tr>` : ''}
                <tr><th>日期</th>${colHeader}</tr>
              </thead>
              <tbody>${rows || '<tr><td colspan="99" style="text-align:center;color:#8b949e;padding:20px">無資料</td></tr>'}</tbody>
            </table>
          </div>
          <div class="legend">
            <span class="missing">—</span> 該平台沒有這天 ｜
            <span class="status-soldout"><span class="dot dot-sold"></span>售完</span> 該平台此日售罄 ｜
            <span class="unknown">?</span> 該平台未公開剩餘張數
          </div>
          <div class="updated">最後更新：${fmtUpdated(data.updatedAt)}</div>
        </div>`;
    }

    fetch('./data/results.json?t=' + Date.now())
      .then(r => r.json())
      .then(render)
      .catch(err => {
        document.getElementById('root').innerHTML =
          `<div class="card"><div class="error-box">無法載入資料：${esc(err.message)}</div></div>`;
      });
  </script>
</body>
</html>
