<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USJ Express Pass 可用性比較</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 16px;
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .sources .card { margin-bottom: 0; }

    .source-label { font-size: 13px; font-weight: 700; color: #e6edf3; margin-bottom: 2px; }
    .product-code { font-size: 12px; color: #484f58; margin-bottom: 4px; font-family: monospace; }
    .product-name { font-size: 14px; color: #8b949e; margin-bottom: 12px; line-height: 1.4; }
    .product-name a { color: #58a6ff; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; }

    .latest-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 12px;
    }
    .latest-badge .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    .latest-badge .date { font-size: 20px; font-weight: 700; color: #79c0ff; }
    .latest-badge .detail { font-size: 12px; color: #8b949e; }

    .meta { font-size: 12px; color: #484f58; }

    .stale {
      display: inline-block;
      background: #f0883e22; border: 1px solid #f0883e55;
      color: #f0883e; border-radius: 6px;
      padding: 4px 10px; font-size: 11px; margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 720px;
    }

    thead th {
      text-align: left;
      padding: 6px 10px;
      color: #8b949e;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #30363d;
      white-space: nowrap;
    }
    thead th.group-start { border-left: 1px solid #30363d; }
    thead tr.groups th { text-align: center; color: #e6edf3; font-size: 11px; padding-bottom: 2px; }

    tbody tr { border-bottom: 1px solid #21262d; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.latest { background: #1f6feb0a; }

    td { padding: 9px 10px; white-space: nowrap; }
    td.group-start { border-left: 1px solid #21262d; }

    .date-col { font-variant-numeric: tabular-nums; font-weight: 600; }
    .dow { display: inline-block; width: 20px; text-align: center; margin-left: 4px; font-size: 11px;
           background: #21262d; border-radius: 3px; padding: 1px 2px; color: #8b949e; }
    .dow-sat { background: #1f4068; color: #79c0ff; }
    .dow-sun { background: #4d1f1f; color: #f85149; }
    .latest-marker { font-size: 10px; color: #3fb950; margin-left: 4px; }

    .avail-col { font-variant-numeric: tabular-nums; }
    .avail-low { color: #f0883e; }
    .avail-ok  { color: #8b949e; }
    .unknown   { color: #8b949e; cursor: help; }

    .price-col { font-variant-numeric: tabular-nums; color: #e6edf3; }
    .cheaper { color: #3fb950; font-weight: 600; }

    .status-available { color: #3fb950; }
    .status-soldout   { color: #f85149; }
    .missing { color: #30363d; }

    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .dot-avail  { background: #3fb950; }
    .dot-sold   { background: #f85149; }

    .slot-col { font-variant-numeric: tabular-nums; }

    tbody tr.expandable { cursor: pointer; }
    tbody tr.expandable:hover { background: #21262d55; }
    .caret { display: inline-block; width: 12px; color: #484f58; font-size: 9px; transition: transform 0.12s; }
    tbody tr.open .caret { transform: rotate(90deg); color: #79c0ff; }
    .caret-spacer { display: inline-block; width: 12px; }

    tr.slot-detail > td { background: #0d1117; padding: 14px 10px 16px 22px; white-space: normal; }
    .slot-block + .slot-block { margin-top: 14px; }
    .slot-src { font-size: 11px; color: #8b949e; margin-bottom: 8px; }
    .slot-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .slot-chip {
      background: #1f6feb1a; border: 1px solid #1f6feb44; color: #79c0ff;
      border-radius: 6px; padding: 3px 9px; font-size: 12px;
      font-variant-numeric: tabular-nums; cursor: help;
    }
    .slot-note { font-size: 11px; color: #484f58; margin-top: 8px; }

    .legend { font-size: 11px; color: #484f58; margin-top: 12px; line-height: 1.7; }

    .loading { color: #8b949e; text-align: center; padding: 60px 0; font-size: 14px; }
    .error-box {
      background: #f8514922; border: 1px solid #f8514966;
      border-radius: 8px; padding: 14px; color: #f85149; font-size: 13px;
      word-break: break-word;
    }
    .updated { font-size: 11px; color: #484f58; margin-top: 16px; text-align: right; }

    /*
     * Narrow screens: the table cannot stay a table — four columns per source
     * plus a date would only scroll sideways. Each row becomes its own block
     * and every cell names itself from the data-label the renderer emits.
     */
    @media (max-width: 720px) {
      body { padding: 12px; }
      .card { padding: 18px 16px; border-radius: 10px; }
      .sources { grid-template-columns: 1fr; gap: 12px; }
      .latest-badge { display: flex; width: 100%; }
      .latest-badge .date { font-size: 22px; }
      .updated { text-align: left; }

      .table-wrap { overflow-x: visible; }
      table { min-width: 0; display: block; }
      thead { display: none; }
      tbody { display: block; }

      tbody tr {
        display: block;
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      tbody tr.latest { border-color: #1f6feb55; }

      td { display: flex; justify-content: space-between; align-items: baseline;
           gap: 12px; padding: 5px 0; white-space: normal; }
      td.group-start { border-left: none; }
      td::before {
        content: attr(data-label);
        color: #8b949e;
        font-size: 11px;
        flex: none;
      }
      /* The date is the row's heading, not a labelled field. */
      td.date-col {
        display: block;
        font-size: 15px;
        padding-bottom: 8px;
        margin-bottom: 6px;
        border-bottom: 1px solid #21262d;
      }
      td.date-col::before { content: none; }

      tr.slot-detail { padding: 0; border: none; margin-top: -6px; margin-bottom: 8px; }
      tr.slot-detail > td { display: block; padding: 12px 14px; border-radius: 0 0 8px 8px; }
      tr.slot-detail > td::before { content: none; }
      .slot-chip { padding: 5px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"><div class="card"><div class="loading">載入中...</div></div></div>
  </div>

  <script>
    const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
    const STALE_MS = 2 * 60 * 60 * 1000;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, dd] = d.split('-');
      return `${y}/${m}/${dd}`;
    }

    function fmtUpdated(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('zh-TW', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        }) + ' JST';
      } catch { return iso; }
    }

    function dowClass(n) {
      if (n === 6) return 'dow dow-sat';
      if (n === 0) return 'dow dow-sun';
      return 'dow';
    }

    function money(amount, currency) {
      if (amount == null) return '—';
      try {
        return new Intl.NumberFormat('zh-TW', {
          style: 'currency', currency: currency || 'JPY', maximumFractionDigits: 0
        }).format(amount);
      } catch {
        return String(amount);
      }
    }

    // Prefer the platform's own price string; fall back to formatting the number.
    function priceText(slot, src) {
      if (!slot) return null;
      if (slot.formattedPrice) return slot.formattedPrice;
      return money(slot.pricePerPerson, src.currency);
    }

    function sourceCard(src) {
      if (src.error) {
        return `
          <div class="card">
            <div class="source-label">${esc(src.label || src.id)}</div>
            <div class="error-box">⚠ 抓取失敗：${esc(src.error)}</div>
            <div class="updated">最後嘗試：${fmtUpdated(src.fetchedAt)}</div>
          </div>`;
      }

      const latest = (src.dates || []).find(d => d.date === src.latestDate);
      const stale = src.fetchedAt && (Date.now() - new Date(src.fetchedAt).getTime() > STALE_MS);
      const units = latest && latest.availableUnits != null ? `剩餘 ${latest.availableUnits} 張 ｜ ` : '';
      const perPerson = latest ? priceText(latest, src) : '';
      const total = latest && latest.pricePerPerson != null
        ? ` ｜ ${src.people} 人合計 ${money(latest.pricePerPerson * src.people, src.currency)}`
        : '';

      const latestHtml = latest ? `
        <div class="latest-badge">
          <div>
            <div class="label">最新開放日</div>
            <div class="date">${fmtDate(src.latestDate)} <span class="${dowClass(latest.dayOfWeek)}">${DAY_NAMES[latest.dayOfWeek]}</span></div>
            <div class="detail">${units}${esc(perPerson)} /人${total}</div>
          </div>
        </div>` : '<div class="meta">無可售日期</div>';

      const available = (src.dates || []).filter(d => d.available).length;

      return `
        <div class="card">
          <div class="source-label">${esc(src.label || src.id)}</div>
          <div class="product-code">${esc(src.productCode)} ｜ ${esc(src.currency)}</div>
          <div class="product-name">${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.productName)} ↗</a>` : esc(src.productName)}</div>
          ${stale ? '<div class="stale">⚠ 資料可能過期</div>' : ''}
          ${latestHtml}
          <div class="meta">可售 ${available} / ${(src.dates || []).length} 天 ｜ 查詢 ${src.people} 人</div>
          <div class="updated">更新：${fmtUpdated(src.fetchedAt)}</div>
        </div>`;
    }

    // Three distinct "no number" states: date missing on this platform,
    // sold out, or the platform simply never publishes a count.
    function cells(slot, src, isGroupStart, showSourceInLabel) {
      const gs = isGroupStart ? ' group-start' : '';
      // data-label drives the stacked layout on narrow screens, where the
      // table header is hidden and each cell has to name itself.
      const p = showSourceInLabel ? `${src.label || src.id} ` : '';
      const L = {
        status: `data-label="${esc(p)}狀態"`,
        avail: `data-label="${esc(p)}剩餘"`,
        price: `data-label="${esc(p)}票價/人"`,
        slots: `data-label="${esc(p)}時段"`,
      };

      if (!slot) {
        return `
          <td class="missing${gs}" ${L.status}>—</td>
          <td class="missing" ${L.avail}>—</td>
          <td class="missing" ${L.price}>—</td>
          <td class="missing" ${L.slots}>—</td>`;
      }

      const statusClass = slot.available ? 'status-available' : 'status-soldout';
      const dot = slot.available ? 'dot-avail' : 'dot-sold';
      const statusText = slot.available ? '販售中' : '售完';

      let availCell;
      if (!slot.available) {
        availCell = `<td class="avail-col missing" ${L.avail}>—</td>`;
      } else if (slot.availableUnits == null) {
        availCell = `<td class="avail-col unknown" ${L.avail} title="此平台未公開剩餘張數">?</td>`;
      } else {
        const cls = slot.availableUnits <= 10 ? 'avail-low' : 'avail-ok';
        availCell = `<td class="avail-col ${cls}" ${L.avail}>${slot.availableUnits}</td>`;
      }

      // timeSlots === null means this date was never looked up (only the
      // latest on-sale date is, to keep the run to a few requests).
      let slotCell;
      if (!slot.timeSlots) {
        slotCell = `<td class="slot-col missing" ${L.slots}>—</td>`;
      } else if (slot.timeSlots.length === 0) {
        slotCell = `<td class="slot-col status-soldout" ${L.slots}>0</td>`;
      } else {
        const cls = slot.timeSlots.length <= 2 ? 'avail-low' : 'avail-ok';
        slotCell = `<td class="slot-col ${cls}" ${L.slots}>${slot.timeSlots.length}</td>`;
      }

      return `
        <td class="${statusClass}${gs}" ${L.status}><span><span class="dot ${dot}"></span>${statusText}</span></td>
        ${availCell}
        <td class="price-col" ${L.price}>${esc(priceText(slot, src) ?? '—')}</td>
        ${slotCell}`;
    }

    // Detail row listing each still-bookable entry window for a date.
    function slotDetail(date, perSource, sources, colspan) {
      const blocks = [];

      for (const src of sources) {
        const slot = perSource[src.id];
        if (!slot || !slot.timeSlots || slot.timeSlots.length === 0) continue;

        const names = src.attractionNames || {};
        const chips = slot.timeSlots.map(ts => {
          const detail = (ts.events || [])
            .map(e => `${names[e.code] || e.code} ${e.from}–${e.to}`)
            .join('\n');
          return `<span class="slot-chip" title="${esc(detail)}">${esc(ts.from)}–${esc(ts.to)}</span>`;
        }).join('');

        const nonTimed = (src.nonTimedAttractions || []).map(c => names[c] || c);
        blocks.push(`
          <div class="slot-block">
            <div class="slot-src">${esc(src.label || src.id)} ｜ ${slot.timeSlots.length} 個可選時段</div>
            <div class="slot-chips">${chips}</div>
            ${nonTimed.length ? `<div class="slot-note">不限時段：${esc(nonTimed.join('、'))}</div>` : ''}
          </div>`);
      }

      if (blocks.length === 0) return '';
      return `<tr class="slot-detail" data-date="${esc(date)}" hidden><td colspan="${colspan}">${blocks.join('')}</td></tr>`;
    }

    function render(data) {
      const root = document.getElementById('root');
      const sources = data.sources || [];

      if (sources.length === 0) {
        root.innerHTML = '<div class="card"><div class="error-box">結果檔中沒有任何來源。</div></div>';
        return;
      }

      // Union of every date any source knows about.
      const byDate = new Map();
      for (const src of sources) {
        for (const slot of (src.dates || [])) {
          if (!byDate.has(slot.date)) byDate.set(slot.date, {});
          byDate.get(slot.date)[src.id] = slot;
        }
      }
      const allDates = [...byDate.keys()].sort();

      const colspan = 1 + sources.length * 4;
      let rows = '';
      for (const date of allDates) {
        const perSource = byDate.get(date);
        const anySlot = sources.map(s => perSource[s.id]).find(Boolean);
        const isLatest = sources.some(s => s.latestDate === date);
        const detail = slotDetail(date, perSource, sources, colspan);

        rows += `
          <tr class="${isLatest ? 'latest' : ''}${detail ? ' expandable' : ''}" data-date="${esc(date)}">
            <td class="date-col">
              ${detail ? '<span class="caret">▸</span>' : '<span class="caret-spacer"></span>'}${fmtDate(date)}<span class="${dowClass(anySlot.dayOfWeek)}">${DAY_NAMES[anySlot.dayOfWeek]}</span>${isLatest ? '<span class="latest-marker">★</span>' : ''}
            </td>
            ${sources.map((s, i) => cells(perSource[s.id], s, i > 0, sources.length > 1)).join('')}
          </tr>${detail}`;
      }

      const groupHeader = sources
        .map((s, i) => `<th colspan="4" class="${i > 0 ? 'group-start' : ''}">${esc(s.label || s.id)}</th>`)
        .join('');
      const colHeader = sources
        .map((s, i) => `<th class="${i > 0 ? 'group-start' : ''}">狀態</th><th>剩餘</th><th>票價/人</th><th>時段</th>`)
        .join('');

      root.innerHTML = `
        <div class="sources">${sources.map(sourceCard).join('')}</div>
        <div class="card">
          <div class="section-title">每日狀況 (${allDates.length} 天)</div>
          <div class="table-wrap">
            <table>
              <thead>
                ${sources.length > 1 ? `<tr class="groups"><th></th>${groupHeader}</tr>` : ''}
                <tr><th>日期</th>${colHeader}</tr>
              </thead>
              <tbody>${rows || '<tr><td colspan="99" style="text-align:center;color:#8b949e;padding:20px">無資料</td></tr>'}</tbody>
            </table>
          </div>
          <div class="legend">
            時段只抓最新開放日（★），點該列展開；其餘日期的時段欄為 <span class="missing">—</span> 代表未查詢 ｜
            <span class="status-soldout"><span class="dot dot-sold"></span>售完</span> 該平台此日售罄 ｜
            <span class="unknown">?</span> 該平台未公開剩餘張數 ｜
            滑過時段標籤看各設施時間
          </div>
          <div class="updated">最後更新：${fmtUpdated(data.updatedAt)}</div>
        </div>`;

      root.querySelectorAll('tr.expandable').forEach(tr => {
        tr.addEventListener('click', () => {
          const detail = root.querySelector(`tr.slot-detail[data-date="${tr.dataset.date}"]`);
          if (!detail) return;
          detail.hidden = !detail.hidden;
          tr.classList.toggle('open', !detail.hidden);
        });
      });
    }

    fetch('./data/results.json?t=' + Date.now())
      .then(r => r.json())
      .then(render)
      .catch(err => {
        document.getElementById('root').innerHTML =
          `<div class="card"><div class="error-box">無法載入資料：${esc(err.message)}</div></div>`;
      });
  </script>
</body>
</html>
