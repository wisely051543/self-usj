<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USJ Express Pass 時段查詢</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 16px;
    }

    .source-label { font-size: 13px; font-weight: 700; color: #e6edf3; margin-bottom: 2px; }
    .product-code { font-size: 12px; color: #484f58; margin-bottom: 4px; font-family: monospace; }
    .product-name { font-size: 14px; color: #8b949e; margin-bottom: 16px; line-height: 1.4; }
    .product-name a { color: #58a6ff; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; }

    .selected-badge {
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .selected-badge .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    .selected-badge .date { font-size: 24px; font-weight: 700; color: #79c0ff; }
    .selected-badge .detail { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .latest-tag {
      font-size: 10px; color: #3fb950; border: 1px solid #3fb95055; background: #3fb9501a;
      border-radius: 4px; padding: 2px 6px; margin-left: 6px; vertical-align: middle;
    }

    .dow { display: inline-block; min-width: 20px; text-align: center; margin-left: 4px; font-size: 12px;
           background: #21262d; border-radius: 3px; padding: 1px 4px; color: #8b949e; vertical-align: middle; }
    .dow-sat { background: #1f4068; color: #79c0ff; }
    .dow-sun { background: #4d1f1f; color: #f85149; }

    .meta { font-size: 12px; color: #484f58; }

    .stale {
      display: inline-block;
      background: #f0883e22; border: 1px solid #f0883e55;
      color: #f0883e; border-radius: 6px;
      padding: 4px 10px; font-size: 11px; margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    /* Date picker — one pill per date whose slots were actually looked up. */
    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: thin;
    }
    .date-pill {
      flex: none;
      min-width: 74px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .date-pill:hover { background: #2d333b; }
    .date-pill.selected { background: #1f6feb33; border-color: #79c0ff; }
    .date-pill .d { font-size: 14px; font-weight: 600; color: #e6edf3; font-variant-numeric: tabular-nums; }
    .date-pill.selected .d { color: #79c0ff; }
    .date-pill .w { font-size: 11px; color: #8b949e; margin-top: 1px; }
    .date-pill .w.sat { color: #79c0ff; }
    .date-pill .w.sun { color: #f85149; }
    .date-pill .n { font-size: 11px; color: #484f58; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .date-pill .n.few { color: #f0883e; }
    .date-pill .n.none { color: #f85149; }

    /* People picker — changing it re-asks the store, so it sits above the slots. */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .people {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 3px;
    }
    .people button {
      width: 30px; height: 28px;
      background: none; border: none; color: #e6edf3;
      font-size: 16px; line-height: 1; cursor: pointer; border-radius: 6px;
    }
    .people button:hover:not(:disabled) { background: #30363d; }
    .people button:disabled { color: #484f58; cursor: default; }
    .people .count {
      min-width: 54px; text-align: center; font-size: 14px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .live-status { font-size: 11px; color: #484f58; }
    .live-status.ok { color: #3fb950; }
    .live-status.busy { color: #79c0ff; }
    .live-status.fail { color: #f0883e; }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .slot-grid.busy { opacity: 0.5; }
    .slot-chip {
      background: #1f6feb1a; border: 1px solid #1f6feb44; color: #79c0ff;
      border-radius: 8px; padding: 10px 8px; font-size: 14px; text-align: center;
      font-variant-numeric: tabular-nums; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .slot-chip .left { display: block; font-size: 11px; margin-top: 3px; color: #8b949e; }
    .slot-chip .left.few { color: #f0883e; }
    .slot-chip:hover { background: #1f6feb33; border-color: #1f6feb88; }
    .slot-chip.open { background: #1f6feb44; border-color: #79c0ff; color: #e6edf3; }

    .slot-detail {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
    }
    .slot-detail .head { color: #79c0ff; font-weight: 600; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
    .slot-detail .ev { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: #8b949e; }
    .slot-detail .ev .time { color: #e6edf3; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .slot-detail .code { font-family: monospace; font-size: 11px; color: #484f58; margin-top: 8px; }

    .slot-note { font-size: 12px; color: #8b949e; margin-top: 14px; line-height: 1.6; }
    .slot-note .k { color: #484f58; }

    .empty { color: #f85149; font-size: 14px; padding: 8px 0; }
    .unknown-slots { color: #8b949e; font-size: 13px; padding: 8px 0; }

    .loading { color: #8b949e; text-align: center; padding: 60px 0; font-size: 14px; }
    .error-box {
      background: #f8514922; border: 1px solid #f8514966;
      border-radius: 8px; padding: 14px; color: #f85149; font-size: 13px;
      word-break: break-word;
    }
    .updated { font-size: 11px; color: #484f58; margin-top: 16px; text-align: right; }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .card { padding: 18px 16px; border-radius: 10px; }
      .selected-badge .date { font-size: 22px; }
      .updated { text-align: left; }
      .slot-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
      .slot-chip { padding: 9px 6px; font-size: 13px; }
      .date-strip { gap: 6px; margin-left: -16px; margin-right: -16px; padding: 0 16px 8px; }
      .date-pill { min-width: 68px; padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"><div class="card"><div class="loading">載入中...</div></div></div>
  </div>

  <script>
    const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
    // Fetcher runs every 15 min; an hour of silence means something is wrong.
    const STALE_MS = 60 * 60 * 1000;
    const STORE_PREFIX = 'usj-selected-date:';

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    // localStorage throws in private mode / blocked-cookie setups; a lost
    // preference must never take the page down with it.
    function readPref(key) {
      try { return localStorage.getItem(STORE_PREFIX + key); } catch { return null; }
    }
    function writePref(key, value) {
      try { localStorage.setItem(STORE_PREFIX + key, value); } catch { /* ignore */ }
    }

    /**
     * ?date=YYYY-MM-DD picks the date for every source; ?<sourceId>=YYYY-MM-DD
     * overrides it for one. A shared link must win over whatever the recipient
     * picked last, so the query string outranks the stored preference.
     */
    function queryDate(sourceId) {
      const q = new URLSearchParams(location.search);
      const value = q.get(sourceId) || q.get('date');
      return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : null;
    }

    /** ?people=N, shared by every source. */
    function queryPeople() {
      const n = Number(new URLSearchParams(location.search).get('people'));
      return Number.isInteger(n) && n >= 1 && n <= MAX_PEOPLE ? n : null;
    }

    /** Keep the URL in sync so the current view is copy-pasteable. */
    function syncQuery(sourceId, date, people) {
      const q = new URLSearchParams(location.search);
      q.set(q.has(sourceId) ? sourceId : 'date', date);
      q.set('people', String(people));
      history.replaceState(null, '', `${location.pathname}?${q}${location.hash}`);
    }

    /* ---------------------------------------------------------------
     * Live lookups against the store's own API. It answers with
     * Access-Control-Allow-Origin: *, so the page can ask it directly —
     * the committed snapshot is only the instant first paint, and anything
     * that depends on the party size has to be asked fresh.
     * --------------------------------------------------------------- */
    const API_BASE = 'https://comm-api.usj.co.jp/occ/v2/b2cportal';
    const API_HEADERS = {
      'Accept': 'application/json, text/plain, */*',
      'x-anonymous-consents': '%5B%5D',
      'Accept-Language': 'ja-JP',
    };
    const MAX_PEOPLE = 10;
    const LIVE_CONCURRENCY = 6;

    function nextDay(date) {
      const [y, m, d] = date.split('-').map(Number);
      const t = new Date(Date.UTC(y, m - 1, d + 1));
      return t.toISOString().slice(0, 10);
    }

    function toMMDDYYYY(date) {
      const [y, m, d] = date.split('-');
      return `${m}/${d}/${y}`;
    }

    async function mapLimit(items, limit, fn) {
      const out = new Array(items.length);
      let next = 0;
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (next < items.length) {
          const i = next++;
          out[i] = await fn(items[i], i);
        }
      }));
      return out;
    }

    /**
     * Inventory for one part number on one date. partNumber is the product code
     * for the date total, or a variant code for a single time slot — the store
     * answers the same shape either way, which is the only route to a per-slot
     * remaining count.
     */
    async function fetchUnits(partNumber, date, people, currency) {
      const res = await fetch(
        `${API_BASE}/products/fetchCalendarDatesWithPriceAndInventory?lang=ja&curr=${currency}`,
        {
          method: 'POST',
          headers: { ...API_HEADERS, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currency,
            events: {
              startDate: `${date} 00:00:01`,
              endDate: nextDay(date),
              partNumber,
              quantity: people,
            },
          }),
        });
      if (!res.ok) throw new Error(`inventory ${res.status}`);

      const body = await res.json();
      const day = (body.eventAvailability?.[0]?.calendarDates || []).find(d => d.date === date);
      if (!day) return null;

      const inv = day.inventoryEvents?.[0];
      const price = day.pricing?.[0];
      return {
        availableUnits: inv ? Number(inv.availableUnits) : null,
        pricePerPerson: price ? price.amount : null,
        formattedPrice: price ? price.formattedAmount : '',
      };
    }

    /** 'EXP_MKC_182000185000' -> 'EXP_MKC'; codes without a time suffix pass through. */
    function baseEventCode(code) {
      return code.replace(/_\d{6,}(_\d{6,})*$/, '');
    }

    /**
     * The bookable slots for a date and party size. Only variants the store
     * would still sell to that many people come back, so the list itself
     * narrows as the party grows.
     */
    async function fetchSlots(productCode, date, people, currency, names) {
      const res = await fetch(
        `${API_BASE}/products/getExpressPassVariantDetails` +
        `?baseProductCode=${encodeURIComponent(productCode)}&selectedDate=${encodeURIComponent(toMMDDYYYY(date))}` +
        `&selectedQty=${people}&lang=ja&curr=${currency}`,
        { headers: API_HEADERS });
      if (!res.ok) throw new Error(`variants ${res.status}`);

      const body = await res.json();
      const slots = [];

      for (const product of body.products || []) {
        const events = [];
        for (const e of product.attractions?.events || []) {
          const code = baseEventCode(e.eventCode);
          if (names[code] == null) names[code] = e.eventName;
          if (e.maingroup !== 'TIMED') continue;
          events.push({ code, from: (e.selectionFromTime || '').slice(0, 5), to: (e.selectionToTime || '').slice(0, 5) });
        }
        if (events.length === 0) continue;
        events.sort((a, b) => a.from.localeCompare(b.from) || a.code.localeCompare(b.code));

        slots.push({
          variantCode: product.code,
          from: events[0].from,
          to: events.reduce((latest, e) => (e.to > latest ? e.to : latest), events[0].to),
          events,
        });
      }

      slots.sort((a, b) => a.from.localeCompare(b.from) || a.variantCode.localeCompare(b.variantCode));
      return slots;
    }

    /** Slots for the date and party size, each with its own remaining count. */
    async function fetchLive(src, date, people) {
      const names = { ...(src.attractionNames || {}) };
      const [slots, day] = await Promise.all([
        fetchSlots(src.productCode, date, people, src.currency, names),
        fetchUnits(src.productCode, date, people, src.currency),
      ]);

      await mapLimit(slots, LIVE_CONCURRENCY, async slot => {
        try {
          const inv = await fetchUnits(slot.variantCode, date, people, src.currency);
          slot.availableUnits = inv ? inv.availableUnits : null;
        } catch {
          slot.availableUnits = null;   // one slot's count failing is not fatal
        }
      });

      return { date, people, slots, day, names, at: Date.now() };
    }

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, dd] = d.split('-');
      return `${y}/${m}/${dd}`;
    }

    function fmtShort(d) {
      const [, m, dd] = d.split('-');
      return `${Number(m)}/${dd}`;
    }

    function fmtUpdated(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('zh-TW', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        }) + ' JST';
      } catch { return iso; }
    }

    function dowClass(n) {
      if (n === 6) return 'dow dow-sat';
      if (n === 0) return 'dow dow-sun';
      return 'dow';
    }

    function dowWordClass(n) {
      if (n === 6) return 'w sat';
      if (n === 0) return 'w sun';
      return 'w';
    }

    function money(amount, currency) {
      if (amount == null) return '—';
      try {
        return new Intl.NumberFormat('zh-TW', {
          style: 'currency', currency: currency || 'JPY', maximumFractionDigits: 0
        }).format(amount);
      } catch {
        return String(amount);
      }
    }

    // Prefer the platform's own price string; fall back to formatting the number.
    function priceText(slot, src) {
      if (!slot) return null;
      if (slot.formattedPrice) return slot.formattedPrice;
      return money(slot.pricePerPerson, src.currency);
    }

    /**
     * The selectable dates are exactly those the fetcher looked slots up for —
     * the month leading to the latest on-sale date. timeSlots === null means
     * the lookup never ran, so such a date has nothing to show.
     */
    function pickableDates(src) {
      return (src.dates || []).filter(d => d.timeSlots);
    }

    /** Per-source view state: which date, how many people, last live answer. */
    const state = new Map();

    /**
     * What to draw right now. A live answer is only usable while it matches the
     * date and party size on screen; otherwise fall back to the snapshot, which
     * was fetched for src.people and says nothing about other party sizes.
     */
    function currentView(src, st) {
      const day = (src.dates || []).find(d => d.date === st.date);
      const live = st.live && st.live.date === st.date && st.live.people === st.people ? st.live : null;

      if (live) {
        return {
          live: true,
          slots: live.slots,
          names: live.names,
          availableUnits: live.day ? live.day.availableUnits : null,
          pricePerPerson: live.day ? live.day.pricePerPerson : (day ? day.pricePerPerson : null),
          formattedPrice: live.day ? live.day.formattedPrice : (day ? day.formattedPrice : ''),
          dayOfWeek: day ? day.dayOfWeek : 0,
        };
      }

      return {
        live: false,
        stalePeople: st.people !== src.people,
        slots: day && day.timeSlots ? day.timeSlots : [],
        names: src.attractionNames || {},
        availableUnits: day ? day.availableUnits : null,
        pricePerPerson: day ? day.pricePerPerson : null,
        formattedPrice: day ? day.formattedPrice : '',
        dayOfWeek: day ? day.dayOfWeek : 0,
      };
    }

    function badgeHtml(src, st, view) {
      const units = view.availableUnits != null ? `剩餘 ${view.availableUnits} 張 ｜ ` : '';
      const perPerson = view.formattedPrice || money(view.pricePerPerson, src.currency);
      const total = view.pricePerPerson != null
        ? ` ｜ ${st.people} 人合計 ${money(view.pricePerPerson * st.people, src.currency)}`
        : '';
      const isLatest = st.date === src.latestDate;

      return `
        <div class="label">${isLatest ? '最新開放日' : '已選日期'}</div>
        <div class="date">
          ${fmtDate(st.date)}
          <span class="${dowClass(view.dayOfWeek)}">${DAY_NAMES[view.dayOfWeek]}</span>
          ${isLatest ? '<span class="latest-tag">最新</span>' : ''}
        </div>
        <div class="detail">${units}${esc(perPerson)} /人${total}</div>`;
    }

    function slotsHtml(src, st, view) {
      if (view.slots.length === 0) {
        return st.busy
          ? '<div class="unknown-slots">查詢中…</div>'
          : `<div class="empty">${view.live ? `此日已無 ${st.people} 人可買的時段` : '此日已無可選時段'}</div>`;
      }

      const chips = view.slots.map((ts, i) => {
        const n = ts.availableUnits;
        const left = n == null ? '' : `<span class="left${n <= 5 ? ' few' : ''}">剩 ${n}</span>`;
        return `<div class="slot-chip" data-i="${i}">${esc(ts.from)}–${esc(ts.to)}${left}</div>`;
      }).join('');

      const nonTimed = (src.nonTimedAttractions || []).map(c => view.names[c] || c);
      const note = view.live
        ? ''
        : `<div class="slot-note"><span class="k">以上為快照資料（${src.people} 人）；即時剩餘張數查詢中或失敗。</span></div>`;

      return `
        <div class="section-title">可選時段 (${view.slots.length})</div>
        <div class="slot-grid${st.busy ? ' busy' : ''}">${chips}</div>
        <div class="slot-detail" hidden></div>
        ${note}
        ${nonTimed.length ? `<div class="slot-note"><span class="k">不限時段：</span>${esc(nonTimed.join('、'))}</div>` : ''}`;
    }

    function statusHtml(st) {
      if (st.busy) return '<span class="live-status busy">● 即時查詢中…</span>';
      if (st.liveError) return `<span class="live-status fail">● 即時查詢失敗（${esc(st.liveError)}），顯示快照</span>`;
      if (st.live && st.live.date === st.date && st.live.people === st.people) {
        const t = new Date(st.live.at).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `<span class="live-status ok">● 即時 ｜ ${t} 向官網查詢</span>`;
      }
      return '<span class="live-status">● 快照資料</span>';
    }

    /** Redraw everything below the date strip from the current state. */
    function paint(card, src) {
      const st = state.get(src.id);
      const view = currentView(src, st);

      card.querySelectorAll('.date-pill').forEach(p => {
        p.classList.toggle('selected', p.dataset.date === st.date);
      });

      card.querySelector('.people .count').textContent = `${st.people} 人`;
      card.querySelector('.people .minus').disabled = st.people <= 1 || st.busy;
      card.querySelector('.people .plus').disabled = st.people >= MAX_PEOPLE || st.busy;
      card.querySelector('.live-wrap').innerHTML = statusHtml(st);
      card.querySelector('.selected-badge').innerHTML = badgeHtml(src, st, view);

      const body = card.querySelector('.slot-body');
      body.innerHTML = slotsHtml(src, st, view);

      const detail = body.querySelector('.slot-detail');
      body.querySelectorAll('.slot-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const wasOpen = chip.classList.contains('open');
          body.querySelectorAll('.slot-chip').forEach(c => c.classList.remove('open'));
          if (wasOpen) { detail.hidden = true; return; }

          const ts = view.slots[Number(chip.dataset.i)];
          chip.classList.add('open');
          detail.innerHTML = `
            <div class="head">${esc(ts.from)}–${esc(ts.to)}${ts.availableUnits != null ? ` ｜ 剩 ${ts.availableUnits} 張` : ''}</div>
            ${(ts.events || []).map(e => `
              <div class="ev">
                <span>${esc(view.names[e.code] || e.code)}</span>
                <span class="time">${esc(e.from)}–${esc(e.to)}</span>
              </div>`).join('')}
            <div class="code">${esc(ts.variantCode)}</div>`;
          detail.hidden = false;
        });
      });
    }

    /**
     * Ask the store for the current date and party size. Every request carries a
     * sequence number so a slow answer for a date the user already left is
     * dropped instead of overwriting a newer one.
     */
    async function refresh(card, src) {
      const st = state.get(src.id);
      const seq = ++st.seq;
      st.busy = true;
      st.liveError = '';
      paint(card, src);

      try {
        const live = await fetchLive(src, st.date, st.people);
        if (seq !== st.seq) return;
        st.live = live;
      } catch (err) {
        if (seq !== st.seq) return;
        st.liveError = err.message || String(err);
      } finally {
        if (seq === st.seq) {
          st.busy = false;
          paint(card, src);
        }
      }
    }

    function selectDate(card, src, date) {
      const st = state.get(src.id);
      if (st.date === date) return;
      st.date = date;
      writePref(src.id, date);
      syncQuery(src.id, date, st.people);
      paint(card, src);
      refresh(card, src);
    }

    function selectPeople(card, src, people) {
      const st = state.get(src.id);
      const next = Math.min(MAX_PEOPLE, Math.max(1, people));
      if (st.people === next) return;
      st.people = next;
      writePref(`${src.id}:people`, String(next));
      syncQuery(src.id, st.date, next);
      paint(card, src);
      refresh(card, src);
    }

    function sourceCard(src) {
      if (src.error) {
        return `
          <div class="card">
            <div class="source-label">${esc(src.label || src.id)}</div>
            <div class="error-box">⚠ 抓取失敗：${esc(src.error)}</div>
            <div class="updated">最後嘗試：${fmtUpdated(src.fetchedAt)}</div>
          </div>`;
      }

      const stale = src.fetchedAt && (Date.now() - new Date(src.fetchedAt).getTime() > STALE_MS);
      const dates = pickableDates(src);

      const pills = dates.map(d => {
        const n = d.timeSlots.length;
        const cls = n === 0 ? 'n none' : n <= 3 ? 'n few' : 'n';
        return `
          <div class="date-pill" data-date="${esc(d.date)}">
            <div class="d">${fmtShort(d.date)}</div>
            <div class="${dowWordClass(d.dayOfWeek)}">${DAY_NAMES[d.dayOfWeek]}</div>
            <div class="${cls}">${n} 時段</div>
          </div>`;
      }).join('');

      const picker = dates.length
        ? `<div class="date-strip">${pills}</div>`
        : '<div class="unknown-slots">尚無已查詢時段的日期</div>';

      return `
        <div class="card" data-src="${esc(src.id)}">
          <div class="source-label">${esc(src.label || src.id)}</div>
          <div class="product-code">${esc(src.productCode)} ｜ ${esc(src.currency)}</div>
          <div class="product-name">${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.productName)} ↗</a>` : esc(src.productName)}</div>
          ${stale ? '<div class="stale">⚠ 資料可能過期</div>' : ''}
          ${picker}
          <div class="controls">
            <div class="people">
              <button class="minus" type="button" aria-label="減少人數">−</button>
              <span class="count"></span>
              <button class="plus" type="button" aria-label="增加人數">+</button>
            </div>
            <span class="live-wrap"></span>
          </div>
          <div class="selected-badge"></div>
          <div class="slot-body"></div>
          <div class="updated">更新：${fmtUpdated(src.fetchedAt)}</div>
        </div>`;
    }

    function render(data) {
      const root = document.getElementById('root');
      const sources = data.sources || [];

      if (sources.length === 0) {
        root.innerHTML = '<div class="card"><div class="error-box">結果檔中沒有任何來源。</div></div>';
        return;
      }

      root.innerHTML = `
        ${sources.map(sourceCard).join('')}
        <div class="updated">最後更新：${fmtUpdated(data.updatedAt)}</div>`;

      for (const src of sources) {
        if (src.error) continue;
        // Matched by property rather than a built selector — source ids come
        // from the data file and need no escaping this way.
        const card = [...root.querySelectorAll('.card')].find(c => c.dataset.src === src.id);
        const dates = pickableDates(src);
        if (!card || dates.length === 0) continue;

        card.querySelectorAll('.date-pill').forEach(pill => {
          pill.addEventListener('click', () => selectDate(card, src, pill.dataset.date));
        });
        card.querySelector('.people .minus').addEventListener('click', () => {
          selectPeople(card, src, state.get(src.id).people - 1);
        });
        card.querySelector('.people .plus').addEventListener('click', () => {
          selectPeople(card, src, state.get(src.id).people + 1);
        });

        // Query string, then last choice — each only while that date is still
        // in the fetched window, since the window slides forward daily. The
        // latest date is the fallback.
        const has = d => !!d && dates.some(x => x.date === d);
        const wanted = [queryDate(src.id), readPref(src.id)].find(has);
        const date = wanted
          || (has(src.latestDate) ? src.latestDate : dates[dates.length - 1].date);

        const savedPeople = Number(readPref(`${src.id}:people`));
        const people = queryPeople()
          || (savedPeople >= 1 && savedPeople <= MAX_PEOPLE ? savedPeople : src.people || 2);

        state.set(src.id, { date, people, live: null, busy: false, liveError: '', seq: 0 });
        writePref(src.id, date);
        writePref(`${src.id}:people`, String(people));
        syncQuery(src.id, date, people);

        paint(card, src);
        card.querySelector('.date-pill.selected')?.scrollIntoView({ block: 'nearest', inline: 'center' });
        refresh(card, src);
      }
    }

    fetch('./data/results.json?t=' + Date.now())
      .then(r => r.json())
      .then(render)
      .catch(err => {
        document.getElementById('root').innerHTML =
          `<div class="card"><div class="error-box">無法載入資料：${esc(err.message)}</div></div>`;
      });
  </script>
</body>
</html>
